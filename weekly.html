<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weekly · Life OS</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<style>
  .wk-head { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; letter-spacing:-0.02em; margin-bottom:4px; }
  .wk-head i { color:var(--accent); font-size:22px; }
  .wk-sub { font-family:var(--mono); font-size:11px; color:var(--text-3); margin-bottom:18px; }
  .wk-avg { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .wk-avg .n { font-size:40px; font-weight:800; color:var(--accent-lt); line-height:1; }
  .wk-avg .u { font-family:var(--mono); font-size:11px; color:var(--text-3); }
  .wk-grid { display:grid; grid-template-columns:48px repeat(3,1fr); gap:0; border:1px solid var(--hair); border-radius:var(--radius); overflow:hidden; }
  .wk-cell { padding:12px 8px; text-align:center; font-family:var(--mono); font-size:12px; font-weight:700;
    border-bottom:1px solid var(--hair); border-right:1px solid var(--hair); background:var(--card); color:var(--text-1); }
  .wk-cell:nth-child(4n) { border-right:none; }
  .wk-grid > .wk-cell:nth-last-child(-n+4) { border-bottom:none; }
  .wk-hdr { font-size:10px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-3); background:var(--bg-2); }
  .wk-day { font-size:11px; color:var(--text-2); background:var(--bg-2); text-align:left; padding-left:12px; }
  .wk-today { background:rgba(249,115,22,0.08); }
  .wk-val { font-variant-numeric:tabular-nums; }
  .wk-hi { color:var(--success); }
  .wk-mid { color:var(--warning); }
  .wk-lo { color:var(--danger); }
  .wk-zero { color:var(--text-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="wk-head"><i class="ti ti-calendar-week"></i> Weekly</div>
    <div class="wk-sub">7-day lookback — ring scores</div>
    <div class="wk-avg"><span class="n" id="wkAvg">—</span><span class="u">avg score</span></div>
  </div>
  <div class="section-title">This Week</div>
  <div class="card" style="padding:0; overflow:hidden;">
    <div class="wk-grid" id="wkGrid"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script>
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function activeDate(){ var d=new Date(); if(d.getHours()<6) d.setDate(d.getDate()-1); return d; }

var SUPPS_TOTAL = 16, HYG_TOTAL = 11;
function stepsGoal(){ var g=storeGet('steps:goal'); return (typeof g==='number' && g>0) ? g : 15000; }

function calcPhysical(date){
  var s=storeGet('supps:'+date)||{}, taken=Object.keys(s).filter(function(k){return s[k];}).length;
  var suppsPct = taken/SUPPS_TOTAL;
  var gym=(storeGet('gym:'+date)||{}).done?1:0;
  var sl=storeGet('sleep:'+date)||{}; var sleep=(sl.bed||sl.wake)?1:0;
  var stp=storeGet('steps:'+date)||{}; var stepsPct=Math.min(1,(stp.count||0)/stepsGoal());
  return Math.round((suppsPct+gym+sleep+stepsPct)/4*100);
}
function calcAppearance(date){
  var h=storeGet('hygiene:'+date)||{}, done=Object.keys(h).filter(function(k){return h[k];}).length;
  return Math.round(done/HYG_TOTAL*100);
}
function calcLife(date){
  var defs=storeGet('todos:defs'); if(!Array.isArray(defs)) defs=[];
  var wd=new Date(date+'T12:00').getDay();
  var due=defs.filter(function(t){ return t.days && t.days.indexOf(wd)!==-1; });
  if(!due.length) return 100;
  var comp=storeGet('todos:'+date)||{};
  var hdone=due.filter(function(t){ return comp[t.id]; }).length;
  return Math.round(hdone/due.length*100);
}

function valClass(v){
  if(v===0) return 'wk-val wk-zero';
  if(v>=80) return 'wk-val wk-hi';
  if(v>=50) return 'wk-val wk-mid';
  return 'wk-val wk-lo';
}

var DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function render(){
  var grid = document.getElementById('wkGrid');
  grid.innerHTML = '';
  var today = activeDate();
  var todayStr = fmtDate(today);

  // header row
  var h0 = document.createElement('div'); h0.className='wk-cell wk-hdr'; h0.textContent='Day'; grid.appendChild(h0);
  var h1 = document.createElement('div'); h1.className='wk-cell wk-hdr'; h1.textContent='Body'; grid.appendChild(h1);
  var h2 = document.createElement('div'); h2.className='wk-cell wk-hdr'; h2.textContent='Look'; grid.appendChild(h2);
  var h3 = document.createElement('div'); h3.className='wk-cell wk-hdr'; h3.textContent='Life'; grid.appendChild(h3);

  var totalP=0, totalA=0, totalL=0, count=0;
  for(var i=6; i>=0; i--){
    var d = new Date(today); d.setDate(d.getDate()-i);
    var ds = fmtDate(d);
    var isToday = (ds === todayStr);
    var extra = isToday ? ' wk-today' : '';

    var pv=calcPhysical(ds), av=calcAppearance(ds), lv=calcLife(ds);
    totalP+=pv; totalA+=av; totalL+=lv; count++;

    var c0=document.createElement('div'); c0.className='wk-cell wk-day'+extra;
    c0.textContent=DAYS_SHORT[d.getDay()]+(isToday?' ·':''); grid.appendChild(c0);

    var c1=document.createElement('div'); c1.className='wk-cell'+extra+' '+valClass(pv);
    c1.textContent=pv+'%'; grid.appendChild(c1);

    var c2=document.createElement('div'); c2.className='wk-cell'+extra+' '+valClass(av);
    c2.textContent=av+'%'; grid.appendChild(c2);

    var c3=document.createElement('div'); c3.className='wk-cell'+extra+' '+valClass(lv);
    c3.textContent=lv+'%'; grid.appendChild(c3);
  }

  var avg = Math.round((totalP+totalA+totalL)/(count*3));
  document.getElementById('wkAvg').textContent = avg + '%';
}
render();
window.addEventListener('lo-sync-applied', render);
window.addEventListener('focus', render);
</script>
</body>
</html>
