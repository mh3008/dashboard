<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life OS</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<style>
  :root {
    --c-body:   #a78bfa; --c-body-glow:   rgba(167,139,250,0.35); --c-body-bg:   rgba(167,139,250,0.06); --c-body-bd:   rgba(167,139,250,0.18);
    --c-look:   #fb923c; --c-look-glow:   rgba(251,146,60,0.35);  --c-look-bg:   rgba(251,146,60,0.06);  --c-look-bd:   rgba(251,146,60,0.18);
    --c-life:   #6be3a4; --c-life-glow:   rgba(107,227,164,0.35); --c-life-bg:   rgba(107,227,164,0.06); --c-life-bd:   rgba(107,227,164,0.18);
    --c-money:  #f87171; --c-money-glow:  rgba(248,113,113,0.35); --c-money-bg:  rgba(248,113,113,0.06); --c-money-bd:  rgba(248,113,113,0.18);
  }

  /* ---- section cards ---- */
  .sec-stack { display:flex; flex-direction:column; gap:12px; }
  .sec-card {
    position:relative; display:block; text-decoration:none; color:inherit;
    border-radius:var(--radius); padding:18px 18px 18px 22px; overflow:hidden;
    cursor:pointer; backdrop-filter:blur(24px) saturate(1.2); -webkit-backdrop-filter:blur(24px) saturate(1.2);
    box-shadow:0 12px 40px rgba(0,0,0,0.45);
    opacity:0; transform:translateY(20px);
    transition:opacity .5s ease-out, transform .5s ease-out, box-shadow .18s ease;
  }
  .sec-card.lo-visible { opacity:1; transform:translateY(0); }
  .sec-card:hover { transform:translateY(-2px); box-shadow:0 18px 48px rgba(0,0,0,0.55); }
  .sec-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }

  .sec-card[data-sec="body"]  { background:var(--c-body-bg);  border:1px solid var(--c-body-bd); }
  .sec-card[data-sec="body"]::before  { background:var(--c-body);  box-shadow:0 0 12px var(--c-body-glow); }
  .sec-card[data-sec="look"]  { background:var(--c-look-bg);  border:1px solid var(--c-look-bd); }
  .sec-card[data-sec="look"]::before  { background:var(--c-look);  box-shadow:0 0 12px var(--c-look-glow); }
  .sec-card[data-sec="life"]  { background:var(--c-life-bg);  border:1px solid var(--c-life-bd); }
  .sec-card[data-sec="life"]::before  { background:var(--c-life);  box-shadow:0 0 12px var(--c-life-glow); }
  .sec-card[data-sec="money"] { background:var(--c-money-bg); border:1px solid var(--c-money-bd); }
  .sec-card[data-sec="money"]::before { background:var(--c-money); box-shadow:0 0 12px var(--c-money-glow); }

  .sec-card.lo-pulse::before { animation:secPulse 2s ease-in-out infinite; }
  @keyframes secPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
  @media (prefers-reduced-motion: reduce) { .sec-card.lo-pulse::before { animation:none; } }

  .sec-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .sec-icon { font-size:19px; }
  .sec-card[data-sec="body"]  .sec-icon, .sec-card[data-sec="body"]  .sec-name { color:var(--c-body); }
  .sec-card[data-sec="look"]  .sec-icon, .sec-card[data-sec="look"]  .sec-name { color:var(--c-look); }
  .sec-card[data-sec="life"]  .sec-icon, .sec-card[data-sec="life"]  .sec-name { color:var(--c-life); }
  .sec-card[data-sec="money"] .sec-icon, .sec-card[data-sec="money"] .sec-name { color:var(--c-money); }
  .sec-name { font-size:15px; font-weight:800; letter-spacing:-0.01em; flex:1; }
  .sec-pct-txt { font-family:var(--mono); font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text-2); }

  .sec-ring { width:52px; height:52px; position:relative; flex-shrink:0; }
  .sec-ring svg { width:52px; height:52px; }
  .sec-ring .srt { fill:none; stroke:rgba(255,255,255,0.08); stroke-width:5; }
  .sec-ring .srf { fill:none; stroke-width:5; stroke-linecap:round; transform:rotate(-90deg); transform-origin:26px 26px; transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
  .sec-ring .sr-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:800; color:var(--text-1); font-variant-numeric:tabular-nums; }

  .sec-body { display:flex; flex-direction:column; gap:10px; }

  .sec-row-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .sec-row-label { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text-2); flex:1; }
  .sec-row-label i { font-size:14px; color:var(--text-3); }
  .sec-row-val { font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--text-1); font-variant-numeric:tabular-nums; }
  .sec-row-val.hit { color:var(--success); }
  .sec-row-val.dim { color:var(--text-3); font-weight:600; }
  .sec-bar { height:6px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .sec-bar-fill { height:100%; border-radius:999px; width:0; transition:width .6s ease-out; }
  .sec-bar-fill.body  { background:var(--c-body); }
  .sec-bar-fill.look  { background:var(--c-look); }
  .sec-bar-fill.life  { background:var(--c-life); }
  .sec-bar-fill.money { background:var(--c-money); }

  .sec-sub { font-family:var(--mono); font-size:11px; color:var(--text-3); padding-top:10px; margin-top:2px; border-top:1px solid var(--hair); }
  .sec-sub.good { color:var(--success); }
  .sec-sub b { color:var(--text-1); font-weight:800; }

  .sec-tasks { display:flex; flex-direction:column; gap:6px; }
  .sec-task { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2); }
  .sec-task i { font-size:14px; color:var(--text-3); flex-shrink:0; }
  .sec-task.done { color:var(--text-3); text-decoration:line-through; }
  .sec-task.done i { color:var(--c-life); }
  .sec-more { font-family:var(--mono); font-size:10.5px; color:var(--text-3); }

  .sec-empty-note { font-size:12.5px; color:var(--text-2); text-align:center; padding:6px 0; }
</style>
</head>
<body>

<div class="wrap">

  <!-- HERO: day ring -->
  <div class="card">
    <div class="hero">
      <div class="day-ring">
        <svg viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="92"></circle>
          <circle class="ring-fill" id="dayFill" cx="100" cy="100" r="92"></circle>
        </svg>
        <div class="ring-overlay">
          <div class="ring-pct" id="dayPct">—</div>
          <div class="ring-phase" id="dayPhase">--</div>
          <div class="ring-clock" id="dayClock">--:--</div>
        </div>
      </div>
      <div class="hero-side">
        <div class="hero-status" id="dayStatus">Booting…</div>
        <div class="hero-remain" id="dayRemain">—</div>
        <div class="hero-range">8:00 AM – 12:00 AM awake window</div>
      </div>
    </div>

    <!-- goal ticker -->
    <div class="ticker">
      <span class="ticker-dot"></span>
      <span class="ticker-label">GOALS</span>
      <div class="ticker-stage"><div class="ticker-txt" id="tickTxt">Loading…</div></div>
      <span class="ticker-meta" id="tickMeta">0/0</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="section-title">Stats</div>
  <div class="sec-stack" id="secStack"></div>

  <!-- SYSTEM -->
  <div class="section-title">System</div>
  <div class="sys-grid">
    <a class="sys-tile" href="todos.html"><i class="ti ti-checkbox"></i><span>Todos</span></a>
    <a class="sys-tile" href="streaks.html"><i class="ti ti-flame"></i><span>Streaks</span></a>
    <a class="sys-tile" href="goals.html"><i class="ti ti-target-arrow"></i><span>Goals</span></a>
    <a class="sys-tile" href="countdowns.html"><i class="ti ti-hourglass"></i><span>Countdowns</span></a>
    <a class="sys-tile" href="weekly.html"><i class="ti ti-calendar-week"></i><span>Weekly</span></a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script>
/* ---------- helpers ---------- */
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function pad2(n){ return String(n).padStart(2,'0'); }
function getActiveDateString(){
  var d = new Date();
  if (d.getHours() < 6) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dayDiff(a,b){
  var pa=a.split('-'),pb=b.split('-');
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000);
}
function toMin(t){ if(!t||t.indexOf(':')<0) return null; var p=t.split(':'); return (+p[0])*60+(+p[1]); }
function durMins(bed,wake){ var b=toMin(bed),w=toMin(wake); if(b==null||w==null) return null; if(w<=b) w+=1440; return w-b; }

/* ---------- DAY RING (sun-cycle) ---------- */
var WAKE_HOUR = 8, SLEEP_HOUR = 24;
var DAY_C = 2 * Math.PI * 92;
var SUN = [
  [0,   [255,216,158]], [12.5,[255,205,121]], [25,  [255,227,143]],
  [37.5,[255,183,106]], [50,  [255,149, 89]], [62.5,[243,111, 79]],
  [75,  [226, 93,122]], [87.5,[123, 91,176]], [100, [ 47, 58,102]]
];
function sunColor(pct){
  for (var i=0;i<SUN.length-1;i++){
    var a=SUN[i], b=SUN[i+1];
    if (pct>=a[0] && pct<=b[0]){
      var t=(pct-a[0])/(b[0]-a[0]);
      var r=Math.round(a[1][0]+(b[1][0]-a[1][0])*t);
      var g=Math.round(a[1][1]+(b[1][1]-a[1][1])*t);
      var bl=Math.round(a[1][2]+(b[1][2]-a[1][2])*t);
      return 'rgb('+r+','+g+','+bl+')';
    }
  }
  return 'rgb(47,58,102)';
}
function updateDayRing(){
  var now=new Date();
  var hrs=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  var fill=document.getElementById('dayFill');
  var pctEl=document.getElementById('dayPct'), phaseEl=document.getElementById('dayPhase');
  var statusEl=document.getElementById('dayStatus'), remainEl=document.getElementById('dayRemain');

  fill.setAttribute('stroke-dasharray', DAY_C);

  if (hrs < WAKE_HOUR){
    fill.setAttribute('stroke-dashoffset', DAY_C);
    fill.setAttribute('stroke', '#4d4b47');
    pctEl.textContent='—'; phaseEl.textContent='SLEEPING';
    statusEl.textContent='😴 Still sleeping';
    var toWake=WAKE_HOUR-hrs;
    remainEl.textContent=Math.floor(toWake)+'h '+Math.round((toWake%1)*60)+'m until wake-up';
    return;
  }
  var pct=Math.min(100,(hrs-WAKE_HOUR)/(SLEEP_HOUR-WAKE_HOUR)*100);
  var col=sunColor(pct);
  fill.setAttribute('stroke-dashoffset', DAY_C*(1-pct/100));
  fill.setAttribute('stroke', col);
  pctEl.textContent=Math.round(pct)+'%';
  pctEl.style.color=col;

  var phase,status;
  if (pct<25){ phase='MORNING'; status='☀️ Morning — fresh start'; }
  else if (pct<50){ phase='MIDDAY'; status='⚡ Midday — keep moving'; }
  else if (pct<75){ phase='AFTERNOON'; status='🔥 Afternoon — push it'; }
  else if (pct<90){ phase='EVENING'; status='⏳ Evening — wrap up'; }
  else { phase='BEDTIME'; status='🌙 Bedtime soon'; }
  phaseEl.textContent=phase; statusEl.textContent=status;
  var left=SLEEP_HOUR-hrs;
  remainEl.textContent=Math.floor(left)+'h '+Math.round((left%1)*60)+'m awake time left';
}
function updateClock(){
  var d=new Date(), h=d.getHours(), m=pad2(d.getMinutes());
  var ap=h>=12?'PM':'AM'; var h12=h%12; if(h12===0)h12=12;
  document.getElementById('dayClock').textContent=h12+':'+m+' '+ap;
}

/* ---------- shared thresholds (match physical/appearance/life pages) ---------- */
var SUPPS_TOTAL = 16, HYG_TOTAL = 11;
function stepsGoal(){ var g=storeGet('steps:goal'); return (typeof g==='number' && g>0) ? g : 15000; }
var HYG_GROUPS = [
  { id:'AM', label:'AM', items:['Warm water face rinse','Moisturise (Purito)','Brush teeth','Tongue scrape','Deodorant','Hair — leave-in + style'] },
  { id:'PM', label:'PM', items:['Shower','Cleanse (Anua)','Moisturise (Purito)','Brush teeth','Tongue scrape'] }
];
var PLANTS = [
  { id:'aloe',  name:'Aloe Vera',  days:14 },
  { id:'peace', name:'Peace Lily', days:7 },
  { id:'yucca', name:'Yucca',      days:10 }
];

function ringSvg(pct, colorVar, size){
  var r = (size/2) - 4;
  var c = 2 * Math.PI * r;
  var off = c * (1 - Math.min(100,pct)/100);
  return '<svg viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="srt" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'"></circle>'+
    '<circle class="srf" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" stroke="'+colorVar+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"></circle>'+
    '</svg>';
}

/* ---------- BODY (purple) ---------- */
function buildBody(date){
  var s=storeGet('supps:'+date)||{}, taken=0, k;
  for(k in s){ if(s.hasOwnProperty(k) && s[k]) taken++; }
  var suppsPct = taken/SUPPS_TOTAL;

  var gymDone = !!(storeGet('gym:'+date)||{}).done;

  var sl=storeGet('sleep:'+date)||{};
  var mins = durMins(sl.bed, sl.wake);
  var sleepDone = !!(sl.bed || sl.wake);
  var sleepHours = mins!=null ? (mins/60) : null;

  var stp=storeGet('steps:'+date)||{};
  var stepsCount = stp.count||0, goal = stepsGoal();
  var stepsPct = Math.min(1, stepsCount/goal);

  var pct = Math.round((suppsPct+(gymDone?1:0)+(sleepDone?1:0)+stepsPct)/4*100);

  var html = '';
  html += '<div class="sec-row">'+
    '<div class="sec-row-top"><span class="sec-row-label"><i class="ti ti-barbell"></i>Gym</span>'+
    '<span class="sec-row-val'+(gymDone?' hit':' dim')+'">'+(gymDone?'Done ✓':'Not yet')+'</span></div>'+
    '<div class="sec-bar"><div class="sec-bar-fill body" data-w="'+(gymDone?100:0)+'"></div></div></div>';

  html += '<div class="sec-row">'+
    '<div class="sec-row-top"><span class="sec-row-label"><i class="ti ti-pill"></i>Supps</span>'+
    '<span class="sec-row-val">'+taken+' / '+SUPPS_TOTAL+'</span></div>'+
    '<div class="sec-bar"><div class="sec-bar-fill body" data-w="'+Math.round(suppsPct*100)+'"></div></div></div>';

  html += '<div class="sec-row">'+
    '<div class="sec-row-top"><span class="sec-row-label"><i class="ti ti-walk"></i>Steps</span>'+
    '<span class="sec-row-val">'+stepsCount.toLocaleString()+' / '+goal.toLocaleString()+'</span></div>'+
    '<div class="sec-bar"><div class="sec-bar-fill body" data-w="'+Math.round(stepsPct*100)+'"></div></div></div>';

  html += '<div class="sec-row">'+
    '<div class="sec-row-top"><span class="sec-row-label"><i class="ti ti-moon"></i>Sleep</span>'+
    '<span class="sec-row-val'+(sleepHours!=null?'':' dim')+'">'+(sleepHours!=null?(Math.round(sleepHours*10)/10)+'h':'—')+'</span></div>'+
    '<div class="sec-bar"><div class="sec-bar-fill body" data-w="'+(sleepHours!=null?Math.min(100,Math.round(sleepHours/8*100)):0)+'"></div></div></div>';

  return { pct:pct, html:html };
}

/* ---------- LOOK (orange) ---------- */
function buildLook(date){
  var h=storeGet('hygiene:'+date)||{};
  var done=0, nextItem=null, i;
  HYG_GROUPS.forEach(function(g){
    g.items.forEach(function(name, idx){
      var ik = g.id+':'+idx;
      if (h[ik]) done++;
      else if (!nextItem) nextItem = name;
    });
  });
  var pct = Math.round(done/HYG_TOTAL*100);

  var html = '<div class="sec-row">'+
    '<div class="sec-row-top"><span class="sec-row-label">Grooming</span>'+
    '<span class="sec-row-val">'+done+' / '+HYG_TOTAL+' done</span></div>'+
    '<div class="sec-bar"><div class="sec-bar-fill look" data-w="'+pct+'"></div></div></div>';

  if (!nextItem){
    html += '<div class="sec-sub good">All done ✨</div>';
  } else {
    html += '<div class="sec-sub">Next up: <b>'+nextItem+'</b></div>';
  }
  return { pct:pct, html:html };
}

/* ---------- LIFE (green) ---------- */
function buildLife(date){
  var defs=storeGet('todos:defs'); if(!Array.isArray(defs)) defs=[];
  var wd=new Date(date+'T12:00').getDay();
  var due=defs.filter(function(t){ return t.days && t.days.indexOf(wd)!==-1; });
  var comp=storeGet('todos:'+date)||{};
  var hdone=due.filter(function(t){ return comp[t.id]; }).length;
  var pct = due.length ? Math.round(hdone/due.length*100) : 100;

  var html = '<div class="sec-row">'+
    '<div class="sec-row-top"><span class="sec-row-label">Today’s tasks</span>'+
    '<span class="sec-row-val">'+hdone+' / '+due.length+' done</span></div>'+
    '<div class="sec-bar"><div class="sec-bar-fill life" data-w="'+pct+'"></div></div></div>';

  if (!due.length){
    html += '<div class="sec-empty-note">Nothing due today. Nice.</div>';
  } else {
    html += '<div class="sec-tasks">';
    due.slice(0,3).forEach(function(t){
      var isDone = !!comp[t.id];
      html += '<div class="sec-task'+(isDone?' done':'')+'"><i class="ti '+(isDone?'ti-circle-check':'ti-circle')+'"></i>'+t.name+'</div>';
    });
    html += '</div>';
    if (due.length > 3){
      html += '<div class="sec-more">+'+(due.length-3)+' more</div>';
    }
  }

  var pdata = storeGet('plants:data') || {};
  var today = date;
  var best = null;
  PLANTS.forEach(function(p){
    var rec = pdata[p.id];
    if (!rec || !rec.lastWatered) return;
    var since = dayDiff(rec.lastWatered, today);
    var daysLeft = p.days - since;
    if (best === null || daysLeft < best.daysLeft) best = { name:p.name, daysLeft:daysLeft };
  });
  if (best){
    var when = best.daysLeft <= 0 ? 'now' : ('in '+best.daysLeft+'d');
    html += '<div class="sec-sub">🌱 Next water: <b>'+best.name+'</b> '+when+'</div>';
  } else {
    html += '<div class="sec-sub">🌱 Plants</div>';
  }

  return { pct:pct, html:html };
}

/* ---------- MONEY (red) — launcher, no ring ---------- */
function buildMoney(date){
  var queue = storeGet('learn:queue'); if(!Array.isArray(queue)) queue=[];
  var qDone = queue.filter(function(q){ return q.done; }).length;
  var qTotal = queue.length;
  var pct = qTotal ? Math.round(qDone/qTotal*100) : 0;
  var nextTopic = null, i;
  for (i=0;i<queue.length;i++){ if (!queue[i].done){ nextTopic = queue[i].name; break; } }

  var trades = storeGet('trades:log'); if(!Array.isArray(trades)) trades=[];
  var weekCount = 0;
  trades.forEach(function(t){
    if (!t.date) return;
    var diff = dayDiff(t.date, date);
    if (diff>=0 && diff<=6) weekCount++;
  });

  var html = '';
  if (!qTotal && !trades.length){
    html += '<div class="sec-empty-note">Start your trading journey →</div>';
  } else {
    html += '<div class="sec-row">'+
      '<div class="sec-row-top"><span class="sec-row-label">Learn queue</span>'+
      '<span class="sec-row-val">'+qDone+' / '+qTotal+' done</span></div>'+
      '<div class="sec-bar"><div class="sec-bar-fill money" data-w="'+pct+'"></div></div></div>';
    if (nextTopic){
      html += '<div class="sec-sub">Now: <b>'+nextTopic+'</b></div>';
    }
    html += '<div class="sec-sub">'+weekCount+' trade'+(weekCount===1?'':'s')+' this week</div>';
  }
  return { pct:pct, html:html };
}

/* ---------- SECTIONS ---------- */
var SECTIONS = [
  { id:'body',  sec:'body',  href:'physical.html',   icon:'ti-activity',       name:'Body',  ring:true,  build:buildBody  },
  { id:'look',  sec:'look',  href:'appearance.html', icon:'ti-sparkles',       name:'Look',  ring:true,  build:buildLook  },
  { id:'life',  sec:'life',  href:'life.html',       icon:'ti-home',           name:'Life',  ring:true,  build:buildLife  },
  { id:'money', sec:'money', href:'money.html',      icon:'ti-currency-pound', name:'Money', ring:false, build:buildMoney }
];

function renderStats(){
  var stack = document.getElementById('secStack');
  var date = getActiveDateString();
  stack.innerHTML = '';

  SECTIONS.forEach(function(s, idx){
    var res = s.build(date);
    var a = document.createElement('a');
    a.className = 'sec-card';
    a.setAttribute('data-sec', s.sec);
    a.href = s.href;

    var topHtml = '<div class="sec-top"><i class="ti '+s.icon+' sec-icon"></i><div class="sec-name">'+s.name+'</div>';
    if (s.ring){
      topHtml += '<div class="sec-ring">'+ringSvg(res.pct, 'var(--c-'+s.sec+')', 52)+'<div class="sr-pct">'+res.pct+'%</div></div>';
    } else {
      topHtml += '<span class="sec-pct-txt">'+res.pct+'%</span>';
    }
    topHtml += '</div>';

    a.innerHTML = topHtml + '<div class="sec-body">' + res.html + '</div>';
    if (res.pct >= 80) a.classList.add('lo-pulse');
    a.style.transitionDelay = (idx*80)+'ms';
    stack.appendChild(a);
  });

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var cards = stack.querySelectorAll('.sec-card');
      cards.forEach(function(c){ c.classList.add('lo-visible'); });
      var bars = stack.querySelectorAll('.sec-bar-fill');
      bars.forEach(function(b){ b.style.width = (b.getAttribute('data-w')||0)+'%'; });
    });
  });
}

/* ---------- GOAL TICKER ---------- */
var tickItems=[], tickIdx=0, tickTimer=null;
function buildTick(){
  var date=getActiveDateString();
  var goals=storeGet('goals:'+date)||[];
  var total=goals.length, done=goals.filter(function(g){return g.done;}).length;
  document.getElementById('tickMeta').textContent=done+'/'+total;
  if (total===0){ tickItems=[{t:'No goals set — add one in Todos.'}]; }
  else if (done===total){ tickItems=[{t:'✓ All goals done — solid day.'}]; }
  else { tickItems=goals.filter(function(g){return !g.done;}).map(function(g){return {t:g.text};}); }
}
function tick(){
  buildTick();
  if (tickIdx>=tickItems.length) tickIdx=0;
  document.getElementById('tickTxt').textContent=tickItems[tickIdx].t;
  tickIdx++;
}

/* ---------- boot ---------- */
updateClock(); updateDayRing(); renderStats(); tick();
setInterval(updateClock, 1000);
setInterval(updateDayRing, 60*1000);
setInterval(tick, 5000);
window.addEventListener('focus', function(){ renderStats(); updateDayRing(); });
window.addEventListener('lo-sync-applied', function(){ renderStats(); tick(); });
</script>
