<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life OS</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<style>
  :root {
    --c-body:   #a78bfa; --c-body-glow:   rgba(167,139,250,0.35); --c-body-bg:   rgba(167,139,250,0.06); --c-body-bd:   rgba(167,139,250,0.18);
    --c-look:   #fb923c; --c-look-glow:   rgba(251,146,60,0.35);  --c-look-bg:   rgba(251,146,60,0.06);  --c-look-bd:   rgba(251,146,60,0.18);
    --c-life:   #6be3a4; --c-life-glow:   rgba(107,227,164,0.35); --c-life-bg:   rgba(107,227,164,0.06); --c-life-bd:   rgba(107,227,164,0.18);
    --c-money:  #f87171; --c-money-glow:  rgba(248,113,113,0.35); --c-money-bg:  rgba(248,113,113,0.06); --c-money-bd:  rgba(248,113,113,0.18);
  }

  /* ---- 2x2 square planet tiles ---- */
  .sec-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
  .sec-tile {
    position:relative; aspect-ratio:1 / 1; display:flex; flex-direction:column; justify-content:space-between;
    border-radius:var(--radius); padding:16px; overflow:hidden; text-decoration:none; color:inherit;
    cursor:pointer; backdrop-filter:blur(24px) saturate(1.2); -webkit-backdrop-filter:blur(24px) saturate(1.2);
    box-shadow:0 10px 30px rgba(0,0,0,0.4), inset 0 0 40px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.04);
    opacity:0; transform:translateY(16px);
    transition:opacity .5s ease-out, transform .5s ease-out, box-shadow .22s ease;
  }
  .sec-tile.lo-visible { opacity:1; transform:translateY(0); }
  .sec-tile:hover { transform:translateY(-3px); }
  .sec-tile::before {
    content:''; position:absolute; top:-32%; right:-32%; width:75%; height:75%; border-radius:50%;
    pointer-events:none; opacity:0.45; filter:blur(6px); transition:opacity .25s ease;
  }
  .sec-tile:hover::before { opacity:0.8; }

  .sec-tile[data-sec="body"]  { background:var(--c-body-bg);  border:1px solid var(--c-body-bd); }
  .sec-tile[data-sec="body"]::before  { background:radial-gradient(circle, var(--c-body) 0%, transparent 70%); }
  .sec-tile[data-sec="body"]:hover    { box-shadow:0 16px 40px var(--c-body-glow), inset 0 0 40px rgba(0,0,0,0.22); }
  .sec-tile[data-sec="look"]  { background:var(--c-look-bg);  border:1px solid var(--c-look-bd); }
  .sec-tile[data-sec="look"]::before  { background:radial-gradient(circle, var(--c-look) 0%, transparent 70%); }
  .sec-tile[data-sec="look"]:hover    { box-shadow:0 16px 40px var(--c-look-glow), inset 0 0 40px rgba(0,0,0,0.22); }
  .sec-tile[data-sec="life"]  { background:var(--c-life-bg);  border:1px solid var(--c-life-bd); }
  .sec-tile[data-sec="life"]::before  { background:radial-gradient(circle, var(--c-life) 0%, transparent 70%); }
  .sec-tile[data-sec="life"]:hover    { box-shadow:0 16px 40px var(--c-life-glow), inset 0 0 40px rgba(0,0,0,0.22); }
  .sec-tile[data-sec="money"] { background:var(--c-money-bg); border:1px solid var(--c-money-bd); }
  .sec-tile[data-sec="money"]::before { background:radial-gradient(circle, var(--c-money) 0%, transparent 70%); }
  .sec-tile[data-sec="money"]:hover   { box-shadow:0 16px 40px var(--c-money-glow), inset 0 0 40px rgba(0,0,0,0.22); }

  .sec-tile.lo-pulse::before { animation:tilePulse 2s ease-in-out infinite; }
  @keyframes tilePulse { 0%,100% { opacity:0.45; } 50% { opacity:0.85; } }
  @media (prefers-reduced-motion: reduce) { .sec-tile.lo-pulse::before { animation:none; } }

  .sec-tile-top { position:relative; display:flex; align-items:center; gap:7px; z-index:1; }
  .sec-tile-icon { font-size:17px; }
  .sec-tile[data-sec="body"]  .sec-tile-icon, .sec-tile[data-sec="body"]  .sec-tile-name { color:var(--c-body); }
  .sec-tile[data-sec="look"]  .sec-tile-icon, .sec-tile[data-sec="look"]  .sec-tile-name { color:var(--c-look); }
  .sec-tile[data-sec="life"]  .sec-tile-icon, .sec-tile[data-sec="life"]  .sec-tile-name { color:var(--c-life); }
  .sec-tile[data-sec="money"] .sec-tile-icon, .sec-tile[data-sec="money"] .sec-tile-name { color:var(--c-money); }
  .sec-tile-name { font-size:12.5px; font-weight:800; letter-spacing:-0.01em; }

  .sec-tile-mid { position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center; }
  .sec-ring { width:64px; height:64px; position:relative; flex-shrink:0; }
  .sec-ring svg { width:64px; height:64px; }
  .sec-ring .srt { fill:none; stroke:rgba(255,255,255,0.08); stroke-width:5; }
  .sec-ring .srf { fill:none; stroke-width:5; stroke-linecap:round; transform:rotate(-90deg); transform-origin:32px 32px; transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
  .sec-ring .sr-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; font-weight:800; color:var(--text-1); font-variant-numeric:tabular-nums; }
  .sec-tile-bigicon { font-size:38px; }

  .sec-tile-stat { position:relative; z-index:1; font-family:var(--mono); font-size:10.5px; color:var(--text-2); font-variant-numeric:tabular-nums; text-align:center; }
</style>
</head>
<body>

<div class="wrap">

  <!-- HERO: day ring -->
  <div class="card">
    <div class="hero">
      <div class="day-ring">
        <svg viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="92"></circle>
          <circle class="ring-fill" id="dayFill" cx="100" cy="100" r="92"></circle>
        </svg>
        <div class="ring-overlay">
          <div class="ring-pct" id="dayPct">—</div>
          <div class="ring-phase" id="dayPhase">--</div>
          <div class="ring-clock" id="dayClock">--:--</div>
        </div>
      </div>
      <div class="hero-side">
        <div class="hero-status" id="dayStatus">Booting…</div>
        <div class="hero-remain" id="dayRemain">—</div>
        <div class="hero-range">8:00 AM – 12:00 AM awake window</div>
      </div>
    </div>

    <!-- goal ticker -->
    <div class="ticker">
      <span class="ticker-dot"></span>
      <span class="ticker-label">GOALS</span>
      <div class="ticker-stage"><div class="ticker-txt" id="tickTxt">Loading…</div></div>
      <span class="ticker-meta" id="tickMeta">0/0</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="section-title">Stats</div>
  <div class="sec-grid" id="secGrid"></div>

  <!-- SYSTEM -->
  <div class="section-title">System</div>
  <div class="sys-grid">
    <a class="sys-tile" href="todos.html"><i class="ti ti-checkbox"></i><span>Todos</span></a>
    <a class="sys-tile" href="streaks.html"><i class="ti ti-flame"></i><span>Streaks</span></a>
    <a class="sys-tile" href="goals.html"><i class="ti ti-target-arrow"></i><span>Goals</span></a>
    <a class="sys-tile" href="countdowns.html"><i class="ti ti-hourglass"></i><span>Countdowns</span></a>
    <a class="sys-tile" href="weekly.html"><i class="ti ti-calendar-week"></i><span>Weekly</span></a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script>
/* ---------- helpers ---------- */
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function pad2(n){ return String(n).padStart(2,'0'); }
function getActiveDateString(){
  var d = new Date();
  if (d.getHours() < 6) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dayDiff(a,b){
  var pa=a.split('-'),pb=b.split('-');
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000);
}
function toMin(t){ if(!t||t.indexOf(':')<0) return null; var p=t.split(':'); return (+p[0])*60+(+p[1]); }
function durMins(bed,wake){ var b=toMin(bed),w=toMin(wake); if(b==null||w==null) return null; if(w<=b) w+=1440; return w-b; }

/* ---------- DAY RING (sun-cycle) ---------- */
var WAKE_HOUR = 8, SLEEP_HOUR = 24;
var DAY_C = 2 * Math.PI * 92;
var SUN = [
  [0,   [255,216,158]], [12.5,[255,205,121]], [25,  [255,227,143]],
  [37.5,[255,183,106]], [50,  [255,149, 89]], [62.5,[243,111, 79]],
  [75,  [226, 93,122]], [87.5,[123, 91,176]], [100, [ 47, 58,102]]
];
function sunColor(pct){
  for (var i=0;i<SUN.length-1;i++){
    var a=SUN[i], b=SUN[i+1];
    if (pct>=a[0] && pct<=b[0]){
      var t=(pct-a[0])/(b[0]-a[0]);
      var r=Math.round(a[1][0]+(b[1][0]-a[1][0])*t);
      var g=Math.round(a[1][1]+(b[1][1]-a[1][1])*t);
      var bl=Math.round(a[1][2]+(b[1][2]-a[1][2])*t);
      return 'rgb('+r+','+g+','+bl+')';
    }
  }
  return 'rgb(47,58,102)';
}
function updateDayRing(){
  var now=new Date();
  var hrs=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  var fill=document.getElementById('dayFill');
  var pctEl=document.getElementById('dayPct'), phaseEl=document.getElementById('dayPhase');
  var statusEl=document.getElementById('dayStatus'), remainEl=document.getElementById('dayRemain');

  fill.setAttribute('stroke-dasharray', DAY_C);

  if (hrs < WAKE_HOUR){
    fill.setAttribute('stroke-dashoffset', DAY_C);
    fill.setAttribute('stroke', '#4d4b47');
    pctEl.textContent='—'; phaseEl.textContent='SLEEPING';
    statusEl.textContent='😴 Still sleeping';
    var toWake=WAKE_HOUR-hrs;
    remainEl.textContent=Math.floor(toWake)+'h '+Math.round((toWake%1)*60)+'m until wake-up';
    return;
  }
  var pct=Math.min(100,(hrs-WAKE_HOUR)/(SLEEP_HOUR-WAKE_HOUR)*100);
  var col=sunColor(pct);
  fill.setAttribute('stroke-dashoffset', DAY_C*(1-pct/100));
  fill.setAttribute('stroke', col);
  pctEl.textContent=Math.round(pct)+'%';
  pctEl.style.color=col;

  var phase,status;
  if (pct<25){ phase='MORNING'; status='☀️ Morning — fresh start'; }
  else if (pct<50){ phase='MIDDAY'; status='⚡ Midday — keep moving'; }
  else if (pct<75){ phase='AFTERNOON'; status='🔥 Afternoon — push it'; }
  else if (pct<90){ phase='EVENING'; status='⏳ Evening — wrap up'; }
  else { phase='BEDTIME'; status='🌙 Bedtime soon'; }
  phaseEl.textContent=phase; statusEl.textContent=status;
  var left=SLEEP_HOUR-hrs;
  remainEl.textContent=Math.floor(left)+'h '+Math.round((left%1)*60)+'m awake time left';
}
function updateClock(){
  var d=new Date(), h=d.getHours(), m=pad2(d.getMinutes());
  var ap=h>=12?'PM':'AM'; var h12=h%12; if(h12===0)h12=12;
  document.getElementById('dayClock').textContent=h12+':'+m+' '+ap;
}

/* ---------- shared thresholds (match physical/appearance/life pages) ---------- */
var SUPPS_TOTAL = 16, HYG_TOTAL = 11;
function stepsGoal(){ var g=storeGet('steps:goal'); return (typeof g==='number' && g>0) ? g : 15000; }
var HYG_GROUPS = [
  { id:'AM', label:'AM', items:['Warm water face rinse','Moisturise (Purito)','Brush teeth','Tongue scrape','Deodorant','Hair — leave-in + style'] },
  { id:'PM', label:'PM', items:['Shower','Cleanse (Anua)','Moisturise (Purito)','Brush teeth','Tongue scrape'] }
];
function ringSvg(pct, colorVar, size){
  var r = (size/2) - 4;
  var c = 2 * Math.PI * r;
  var off = c * (1 - Math.min(100,pct)/100);
  return '<svg viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="srt" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'"></circle>'+
    '<circle class="srf" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" stroke="'+colorVar+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"></circle>'+
    '</svg>';
}

/* ---------- BODY (purple) ---------- */
function buildBody(date){
  var s=storeGet('supps:'+date)||{}, taken=0, k;
  for(k in s){ if(s.hasOwnProperty(k) && s[k]) taken++; }
  var suppsPct = taken/SUPPS_TOTAL;

  var gymDone = !!(storeGet('gym:'+date)||{}).done;

  var sl=storeGet('sleep:'+date)||{};
  var sleepDone = !!(sl.bed || sl.wake);

  var stp=storeGet('steps:'+date)||{};
  var stepsCount = stp.count||0, goal = stepsGoal();
  var stepsPct = Math.min(1, stepsCount/goal);

  var pct = Math.round((suppsPct+(gymDone?1:0)+(sleepDone?1:0)+stepsPct)/4*100);
  var line = (gymDone?'✓ Gym':'Gym —') + ' · ' + taken + '/' + SUPPS_TOTAL;

  return { pct:pct, line:line };
}

/* ---------- LOOK (orange) ---------- */
function buildLook(date){
  var h=storeGet('hygiene:'+date)||{};
  var done=0;
  HYG_GROUPS.forEach(function(g){
    g.items.forEach(function(name, idx){
      if (h[g.id+':'+idx]) done++;
    });
  });
  var pct = Math.round(done/HYG_TOTAL*100);
  return { pct:pct, line: done+'/'+HYG_TOTAL };
}

/* ---------- LIFE (green) ---------- */
function buildLife(date){
  var defs=storeGet('todos:defs'); if(!Array.isArray(defs)) defs=[];
  var wd=new Date(date+'T12:00').getDay();
  var due=defs.filter(function(t){ return t.days && t.days.indexOf(wd)!==-1; });
  var comp=storeGet('todos:'+date)||{};
  var hdone=due.filter(function(t){ return comp[t.id]; }).length;
  var pct = due.length ? Math.round(hdone/due.length*100) : 100;
  var line = due.length ? (hdone+'/'+due.length+' tasks') : 'All clear';
  return { pct:pct, line:line };
}

/* ---------- MONEY (red) — launcher, no ring ---------- */
function buildMoney(date){
  var queue = storeGet('learn:queue'); if(!Array.isArray(queue)) queue=[];
  var qDone = queue.filter(function(q){ return q.done; }).length;
  var qTotal = queue.length;

  var trades = storeGet('trades:log'); if(!Array.isArray(trades)) trades=[];
  var weekCount = 0;
  trades.forEach(function(t){
    if (!t.date) return;
    var diff = dayDiff(t.date, date);
    if (diff>=0 && diff<=6) weekCount++;
  });

  var line;
  if (!qTotal && !trades.length){
    line = 'Start your journey →';
  } else {
    line = qTotal ? (qDone+'/'+qTotal+' learn') : '';
    var tradeLine = weekCount+' trade'+(weekCount===1?'':'s')+' wk';
    line = line ? (line+' · '+tradeLine) : tradeLine;
  }
  return { pct:null, line:line };
}

/* ---------- SECTIONS ---------- */
var SECTIONS = [
  { id:'body',  sec:'body',  href:'physical.html',   icon:'ti-activity',       name:'Body',  ring:true,  build:buildBody  },
  { id:'look',  sec:'look',  href:'appearance.html', icon:'ti-sparkles',       name:'Look',  ring:true,  build:buildLook  },
  { id:'life',  sec:'life',  href:'life.html',       icon:'ti-home',           name:'Life',  ring:true,  build:buildLife  },
  { id:'money', sec:'money', href:'money.html',      icon:'ti-currency-pound', name:'Money', ring:false, build:buildMoney }
];

function renderStats(){
  var grid = document.getElementById('secGrid');
  var date = getActiveDateString();
  grid.innerHTML = '';

  SECTIONS.forEach(function(s, idx){
    var res = s.build(date);
    var a = document.createElement('a');
    a.className = 'sec-tile';
    a.setAttribute('data-sec', s.sec);
    a.href = s.href;

    var midHtml;
    if (s.ring){
      midHtml = '<div class="sec-ring">'+ringSvg(res.pct, 'var(--c-'+s.sec+')', 64)+'<div class="sr-pct">'+res.pct+'%</div></div>';
    } else {
      midHtml = '<i class="ti '+s.icon+' sec-tile-bigicon"></i>';
    }

    a.innerHTML =
      '<div class="sec-tile-top"><i class="ti '+s.icon+' sec-tile-icon"></i><span class="sec-tile-name">'+s.name+'</span></div>'+
      '<div class="sec-tile-mid">'+midHtml+'</div>'+
      '<div class="sec-tile-stat">'+res.line+'</div>';

    if (s.ring && res.pct >= 80) a.classList.add('lo-pulse');
    a.style.transitionDelay = (idx*80)+'ms';
    grid.appendChild(a);
  });

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var tiles = grid.querySelectorAll('.sec-tile');
      tiles.forEach(function(t){ t.classList.add('lo-visible'); });
    });
  });
}

/* ---------- GOAL TICKER ---------- */
var tickItems=[], tickIdx=0, tickTimer=null;
function buildTick(){
  var date=getActiveDateString();
  var goals=storeGet('goals:'+date)||[];
  var total=goals.length, done=goals.filter(function(g){return g.done;}).length;
  document.getElementById('tickMeta').textContent=done+'/'+total;
  if (total===0){ tickItems=[{t:'No goals set — add one in Todos.'}]; }
  else if (done===total){ tickItems=[{t:'✓ All goals done — solid day.'}]; }
  else { tickItems=goals.filter(function(g){return !g.done;}).map(function(g){return {t:g.text};}); }
}
function tick(){
  buildTick();
  if (tickIdx>=tickItems.length) tickIdx=0;
  document.getElementById('tickTxt').textContent=tickItems[tickIdx].t;
  tickIdx++;
}

/* ---------- boot ---------- */
updateClock(); updateDayRing(); renderStats(); tick();
setInterval(updateClock, 1000);
setInterval(updateDayRing, 60*1000);
setInterval(tick, 5000);
window.addEventListener('focus', function(){ renderStats(); updateDayRing(); });
window.addEventListener('lo-sync-applied', function(){ renderStats(); tick(); });
</script>
</body>
</html>
