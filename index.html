<style>
  :root {
    --c-body:   #a78bfa; --c-body-glow:   rgba(167,139,250,0.35); --c-body-bg:   rgba(167,139,250,0.06); --c-body-bd:   rgba(167,139,250,0.18);
    --c-look:   #fb923c; --c-look-glow:   rgba(251,146,60,0.35);  --c-look-bg:   rgba(251,146,60,0.06);  --c-look-bd:   rgba(251,146,60,0.18);
    --c-life:   #6be3a4; --c-life-glow:   rgba(107,227,164,0.35); --c-life-bg:   rgba(107,227,164,0.06); --c-life-bd:   rgba(107,227,164,0.18);
    --c-money:  #f87171; --c-money-glow:  rgba(248,113,113,0.35); --c-money-bg:  rgba(248,113,113,0.06); --c-money-bd:  rgba(248,113,113,0.18);
  }

  /* ---- 2x2 square planet tiles ---- */
  .sec-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
  .sec-tile {
    position:relative; aspect-ratio:1 / 1; display:flex; flex-direction:column; justify-content:space-between;
    border-radius:var(--radius); padding:16px; overflow:hidden; text-decoration:none; color:inherit;
    cursor:pointer; backdrop-filter:blur(24px) saturate(1.2); -webkit-backdrop-filter:blur(24px) saturate(1.2);
    box-shadow:0 10px 30px rgba(0,0,0,0.4), inset 0 0 40px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.04);
    opacity:0; transform:translateY(16px);
    transition:opacity .5s ease-out, transform .5s ease-out, box-shadow .22s ease;
  }
  .sec-tile.lo-visible { opacity:1; transform:translateY(0); }
  .sec-tile:hover { transform:translateY(-3px); }
  .sec-tile::before {
    content:''; position:absolute; top:-32%; right:-32%; width:75%; height:75%; border-radius:50%;
    pointer-events:none; opacity:0.45; filter:blur(6px); transition:opacity .25s ease; z-index:0;
  }
  .sec-tile:hover::before { opacity:0.8; }

  .sec-tile[data-sec="body"]  { background:var(--c-body-bg);  border:1px solid var(--c-body-bd); }
  .sec-tile[data-sec="body"]::before  { background:radial-gradient(circle, var(--c-body) 0%, transparent 70%); }
  .sec-tile[data-sec="body"]:hover    { box-shadow:0 16px 40px var(--c-body-glow), inset 0 0 40px rgba(0,0,0,0.22); }
  .sec-tile[data-sec="look"]  { background:var(--c-look-bg);  border:1px solid var(--c-look-bd); }
  .sec-tile[data-sec="look"]::before  { background:radial-gradient(circle, var(--c-look) 0%, transparent 70%); }
  .sec-tile[data-sec="look"]:hover    { box-shadow:0 16px 40px var(--c-look-glow), inset 0 0 40px rgba(0,0,0,0.22); }
  .sec-tile[data-sec="life"]  { background:var(--c-life-bg);  border:1px solid var(--c-life-bd); }
  .sec-tile[data-sec="life"]::before  { background:radial-gradient(circle, var(--c-life) 0%, transparent 70%); }
  .sec-tile[data-sec="life"]:hover    { box-shadow:0 16px 40px var(--c-life-glow), inset 0 0 40px rgba(0,0,0,0.22); }
  .sec-tile[data-sec="money"] { background:var(--c-money-bg); border:1px solid var(--c-money-bd); }
  .sec-tile[data-sec="money"]::before { background:radial-gradient(circle, var(--c-money) 0%, transparent 70%); }
  .sec-tile[data-sec="money"]:hover   { box-shadow:0 16px 40px var(--c-money-glow), inset 0 0 40px rgba(0,0,0,0.22); }

  .sec-tile.lo-pulse::before { animation:tilePulse 2s ease-in-out infinite; }
  @keyframes tilePulse { 0%,100% { opacity:0.45; } 50% { opacity:0.85; } }
  @media (prefers-reduced-motion: reduce) { .sec-tile.lo-pulse::before { animation:none; } }

  .sec-tile-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; }

  .sec-tile-top { position:relative; display:flex; align-items:center; gap:7px; z-index:1; }
  .sec-tile-icon { font-size:17px; }
  .sec-tile[data-sec="body"]  .sec-tile-icon, .sec-tile[data-sec="body"]  .sec-tile-name, .sec-tile[data-sec="body"]  .sec-tile-pct { color:var(--c-body); }
  .sec-tile[data-sec="look"]  .sec-tile-icon, .sec-tile[data-sec="look"]  .sec-tile-name, .sec-tile[data-sec="look"]  .sec-tile-pct { color:var(--c-look); }
  .sec-tile[data-sec="life"]  .sec-tile-icon, .sec-tile[data-sec="life"]  .sec-tile-name, .sec-tile[data-sec="life"]  .sec-tile-pct { color:var(--c-life); }
  .sec-tile[data-sec="money"] .sec-tile-icon, .sec-tile[data-sec="money"] .sec-tile-name, .sec-tile[data-sec="money"] .sec-tile-pct { color:var(--c-money); }
  .sec-tile-name { font-size:12.5px; font-weight:800; letter-spacing:-0.01em; }

  .sec-tile-pct {
    position:absolute; top:14px; right:14px; z-index:1;
    font-family:var(--mono); font-weight:800; font-size:13px; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 6px rgba(0,0,0,0.55);
  }

  .sec-tile-mid { position:relative; z-index:1; flex:1; }

  .sec-tile-stat { position:relative; z-index:1; font-family:var(--mono); font-size:10.5px; color:var(--text-2); font-variant-numeric:tabular-nums; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,0.4); }
</style>

<body>

<div class="wrap">

  <!-- HERO: day ring -->
  <div class="card">
    <div class="hero">
      <div class="day-ring">
        <svg viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="92"></circle>
          <circle class="ring-fill" id="dayFill" cx="100" cy="100" r="92"></circle>

        <div class="ring-overlay">
          <div class="ring-pct" id="dayPct">—</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ---------- helpers ---------- */
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function pad2(n){ return String(n).padStart(2,'0'); }
function getActiveDateString(){
  var d = new Date();
  if (d.getHours() < 6) d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dayDiff(a,b){
  var pa=a.split('-'),pb=b.split('-');
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000);
}
function toMin(t){ if(!t||t.indexOf(':')<0) return null; var p=t.split(':'); return (+p[0])*60+(+p[1]); }
function durMins(bed,wake){ var b=toMin(bed),w=toMin(wake); if(b==null||w==null) return null; if(w<=b) w+=1440; return w-b; }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

/* ---------- DAY RING (sun-cycle) ---------- */
var WAKE_HOUR = 8, SLEEP_HOUR = 24;
var DAY_C = 2 * Math.PI * 92;
var SUN = [
  [0,   [255,216,158]], [12.5,[255,205,121]], [25,  [255,227,143]],
  [37.5,[255,183,106]], [50,  [255,149, 89]], [62.5,[243,111, 79]],
  [75,  [226, 93,122]], [87.5,[123, 91,176]], [100, [ 47, 58,102]]
];
function sunColor(pct){
  for (var i=0;i<SUN.length-1;i++){
    var a=SUN[i], b=SUN[i+1];
    if (pct>=a[0] && pct<=b[0]){
      var t=(pct-a[0])/(b[0]-a[0]);
      var r=Math.round(a[1][0]+(b[1][0]-a[1][0])*t);
      var g=Math.round(a[1][1]+(b[1][1]-a[1][1])*t);
      var bl=Math.round(a[1][2]+(b[1][2]-a[1][2])*t);
      return 'rgb('+r+','+g+','+bl+')';
    }
  }
  return 'rgb(47,58,102)';
}
function updateDayRing(){
  var now=new Date();
  var hrs=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  var fill=document.getElementById('dayFill');
  var pctEl=document.getElementById('dayPct'), phaseEl=document.getElementById('dayPhase');
  var statusEl=document.getElementById('dayStatus'), remainEl=document.getElementById('dayRemain');

  fill.setAttribute('stroke-dasharray', DAY_C);

  if (hrs < WAKE_HOUR){
    fill.setAttribute('stroke-dashoffset', DAY_C);
    fill.setAttribute('stroke', '#4d4b47');
    pctEl.textContent='—'; phaseEl.textContent='SLEEPING';
    statusEl.textContent='😴 Still sleeping';
    var toWake=WAKE_HOUR-hrs;
    remainEl.textContent=Math.floor(toWake)+'h '+Math.round((toWake%1)*60)+'m until wake-up';
    return;
  }
  var pct=Math.min(100,(hrs-WAKE_HOUR)/(SLEEP_HOUR-WAKE_HOUR)*100);
  var col=sunColor(pct);
  fill.setAttribute('stroke-dashoffset', DAY_C*(1-pct/100));
  fill.setAttribute('stroke', col);
  pctEl.textContent=Math.round(pct)+'%';
  pctEl.style.color=col;

  var phase,status;
  if (pct<25){ phase='MORNING'; status='☀️ Morning — fresh start'; }
  else if (pct<50){ phase='MIDDAY'; status='⚡ Midday — keep moving'; }
  else if (pct<75){ phase='AFTERNOON'; status='🔥 Afternoon — push it'; }
  else if (pct<90){ phase='EVENING'; status='⏳ Evening — wrap up'; }
  else { phase='BEDTIME'; status='🌙 Bedtime soon'; }
  phaseEl.textContent=phase; statusEl.textContent=status;
  var left=SLEEP_HOUR-hrs;
  remainEl.textContent=Math.floor(left)+'h '+Math.round((left%1)*60)+'m awake time left';
}
function updateClock(){
  var d=new Date(), h=d.getHours(), m=pad2(d.getMinutes());
  var ap=h>=12?'PM':'AM'; var h12=h%12; if(h12===0)h12=12;
  document.getElementById('dayClock').textContent=h12+':'+m+' '+ap;
}

/* ---------- shared thresholds (match physical/appearance/life pages) ---------- */
var SUPPS_TOTAL = 16, HYG_TOTAL = 11;
function stepsGoal(){ var g=storeGet('steps:goal'); return (typeof g==='number' && g>0) ? g : 15000; }
var HYG_GROUPS = [
  { id:'AM', label:'AM', items:['Warm water face rinse','Moisturise (Purito)','Brush teeth','Tongue scrape','Deodorant','Hair — leave-in + style'] },
  { id:'PM', label:'PM', items:['Shower','Cleanse (Anua)','Moisturise (Purito)','Brush teeth','Tongue scrape'] }
];

/* ============================================================
   SCORE BUILDERS — UNCHANGED formulas/data reads.
   Each returns { pct, life, line, extra }
   ============================================================ */

/* ---------- BODY (purple) — 4 strict all-or-nothing pillars ---------- */
function buildBody(date){
  var s=storeGet('supps:'+date)||{}, taken=0, k;
  for(k in s){ if(s.hasOwnProperty(k) && s[k]) taken++; }
  var suppsHit = taken >= SUPPS_TOTAL;

  var gymDone = !!(storeGet('gym:'+date)||{}).done;

  var sl=storeGet('sleep:'+date)||{};
  var sleepDone = !!(sl.bed || sl.wake);

  var stp=storeGet('steps:'+date)||{};
  var stepsCount = stp.count||0, goal = stepsGoal();
  var stepsHit = stepsCount >= goal;

  var pillars = (gymDone?1:0) + (suppsHit?1:0) + (stepsHit?1:0) + (sleepDone?1:0);
  var pct = pillars * 25;
  var line = pillars + '/4 pillars hit';

  return { pct:pct, life:pct/100, line:line, extra:{ pillars:pillars } };
}

/* ---------- LOOK (orange) — hygiene done/11 ---------- */
function buildLook(date){
  var h=storeGet('hygiene:'+date)||{};
  var done=0;
  HYG_GROUPS.forEach(function(g){
    g.items.forEach(function(name, idx){
      if (h[g.id+':'+idx]) done++;
    });
  });
  var pct = Math.round(done/HYG_TOTAL*100);
  return { pct:pct, life:pct/100, line: done+'/'+HYG_TOTAL, extra:{} };
}

/* ---------- LIFE (green) — today's due tasks done/due ---------- */
function buildLife(date){
  var defs=storeGet('todos:defs'); if(!Array.isArray(defs)) defs=[];
  var wd=new Date(date+'T12:00').getDay();
  var due=defs.filter(function(t){ return t.days && t.days.indexOf(wd)!==-1; });
  var comp=storeGet('todos:'+date)||{};
  var hdone=due.filter(function(t){ return comp[t.id]; }).length;
  var pct = due.length ? Math.round(hdone/due.length*100) : 100;
  var line = due.length ? (hdone+'/'+due.length+' tasks') : 'All clear';
  return { pct:pct, life:pct/100, line:line, extra:{ tasksDone:hdone, tasksTotal:due.length } };
}

/* ---------- MONEY (red) — did something today ---------- */
function buildMoney(date){
  var trades = storeGet('trades:log'); if(!Array.isArray(trades)) trades=[];
  var tradeToday = trades.some(function(t){ return t.date === date; });

  var queue = storeGet('learn:queue'); if(!Array.isArray(queue)) queue=[];
  var learnAny = queue.some(function(q){ return !!q.done; });

  var hit = tradeToday || learnAny;
  var pct = hit ? 100 : 0;
  var line = (tradeToday && learnAny) ? 'Trade + learn ✓' :
             tradeToday ? 'Trade logged ✓' :
             learnAny ? 'Learn done ✓' : 'Nothing yet';

  return { pct:pct, life:pct/100, line:line, extra:{ tradeToday:tradeToday, learnAny:learnAny } };
}

/* ============================================================
   VISUAL CONSTANTS + LOW-LEVEL DRAW HELPERS
   ============================================================ */
var COLOR_BODY  = [167,139,250];
var COLOR_LOOK  = [251,146,60];
var COLOR_LIFE  = [107,227,164];
var COLOR_MONEY = [248,113,113];

function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function mixColor(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function bloom(ctx,x,y,r,color,alpha){
  var g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, rgba(color, alpha));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}
function drawBurst(ctx,cx,cy,progress,color,maxR){
  var r = maxR*progress;
  var alpha = (1-progress)*0.5;
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  var n=10, i;
  for (i=0;i<n;i++){
    var ang = (i/n)*Math.PI*2;
    var pr = r*0.9;
    var px = cx+Math.cos(ang)*pr, py = cy+Math.sin(ang)*pr;
    ctx.fillStyle = rgba(color, alpha);
    ctx.beginPath(); ctx.arc(px,py,1.6,0,Math.PI*2); ctx.fill();
  }
}

/* ============================================================
   PERSISTENT PER-PLANET STATE — created once, reused every
   frame (no per-frame allocation). Idle timers seeded with a
   random future offset so all 4 planets don't fire at once.
   ============================================================ */
function initState(sec, t0){
  var i;
  if (sec==='body'){
    var stars=[];
    for (i=0;i<24;i++){ stars.push({ x:Math.random(), y:Math.random(), r:0.4+Math.random()*1.1, phase:Math.random()*Math.PI*2, speed:0.6+Math.random()*1.4 }); }
    var trails=[];
    for (i=0;i<4;i++){ trails.push([]); }
    return { stars:stars, trails:trails, shoot:null, nextShootAt:t0+5000+Math.random()*7000 };
  }
  if (sec==='look'){
    var clouds=[];
    for (i=0;i<3;i++){ clouds.push({ x:Math.random(), y:0.12+Math.random()*0.22, scale:0.7+Math.random()*0.6, speed:0.15+i*0.08 }); }
    var stars2=[];
    for (i=0;i<14;i++){ stars2.push({ x:Math.random(), y:Math.random()*0.7, r:0.4+Math.random()*0.9, phase:Math.random()*Math.PI*2 }); }
    return { clouds:clouds, stars:stars2, bird:null, nextBirdAt:t0+6000+Math.random()*7000 };
  }
  if (sec==='life'){
    var leaves=[];
    for (i=0;i<5;i++){ leaves.push({ active:false, x:0, y:0, vy:0, rot:0, vr:0 }); }
    var flies=[];
    for (i=0;i<3;i++){ flies.push({ active:false, x:0, y:0, phase:Math.random()*10, kind:(i%2===0?'b':'bee') }); }
    return { leaves:leaves, flies:flies, nextLeafAt:t0+5000+Math.random()*6000 };
  }
  if (sec==='money'){
    var candles=[];
    for (i=0;i<12;i++){ candles.push({ h:6+Math.random()*10, up:Math.random()>0.5 }); }
    var sparks=[];
    for (i=0;i<12;i++){ sparks.push({ active:false, x:0, y:0, vx:0, vy:0, life:0 }); }
    var coins=[];
    for (i=0;i<4;i++){ coins.push({ active:false, x:0, y:0, vy:0, rot:0, bounces:0 }); }
    return { candles:candles, sparks:sparks, coins:coins, nextCandleAt:t0+1400, nextCoinAt:t0+6000+Math.random()*6000 };
  }
  return {};
}

/* ============================================================
   CANVAS DRAW FUNCTIONS — one living planet per domain.
   draw(ctx, w, h, life, now, extra, state, burst)
   ============================================================ */
function drawBody(ctx, w, h, life, now, extra, state, burst){
  if (reduceMotion) now = 0;
  var cx=w/2, cy=h/2, minWH=Math.min(w,h), i;

  /* background: starfield — always bright and twinkling */
  for (i=0;i<state.stars.length;i++){
    var st = state.stars[i];
    var tw = Math.sin(now*0.0015*st.speed + st.phase)*0.5+0.5;
    var a = 0.34+0.5*tw;
    ctx.fillStyle = rgba([220,220,255], a*0.8);
    ctx.beginPath(); ctx.arc(st.x*w, st.y*h, st.r, 0, Math.PI*2); ctx.fill();
  }

  /* idle event: shooting star */
  if (!reduceMotion){
    if (!state.shoot && now > state.nextShootAt){
      state.shoot = { x:w*(0.05+Math.random()*0.25), y:h*(0.08+Math.random()*0.22), vx:minWH*0.95, vy:minWH*0.38, start:now };
      state.nextShootAt = now + 7000+Math.random()*7000;
    }
    if (state.shoot){
      var el = (now-state.shoot.start)/650;
      if (el>=1){ state.shoot = null; }
      else {
        var sxA = state.shoot.x+state.shoot.vx*el, syA = state.shoot.y+state.shoot.vy*el;
        var tX = sxA-state.shoot.vx*0.18, tY = syA-state.shoot.vy*0.18;
        var g2 = ctx.createLinearGradient(tX,tY,sxA,syA);
        g2.addColorStop(0, rgba([255,255,255],0));
        g2.addColorStop(1, rgba([255,255,255],(1-el)*0.85));
        ctx.strokeStyle = g2; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(tX,tY); ctx.lineTo(sxA,syA); ctx.stroke();
      }
    }
  }

  /* midground: bloom halo + heartbeat (double-beat) core — always the real purple, never grey */
  var coreColor = COLOR_BODY;
  var baseR = minWH*0.115;
  var cyc = (now*0.0009) % 1;
  var beat1 = Math.exp(-Math.pow((cyc-0.08)*14,2));
  var beat2 = Math.exp(-Math.pow((cyc-0.22)*14,2));
  var beatAmt = Math.max(beat1,beat2);
  var coreR = baseR*(0.95+0.15*life) + baseR*0.35*beatAmt*(0.65+0.35*life);

  bloom(ctx, cx, cy, coreR*3.4, coreColor, 0.28+0.20*life);

  /* faint crackle texture */
  for (i=0;i<6;i++){
    var nAng = (i/6)*Math.PI*2 + now*0.0004;
    ctx.fillStyle = rgba([255,255,255], 0.12+0.08*life);
    ctx.beginPath(); ctx.arc(cx+Math.cos(nAng)*coreR*0.6, cy+Math.sin(nAng)*coreR*0.6, 1, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = rgba(coreColor, 0.58+0.32*life+0.15*beatAmt);
  ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();

  /* foreground: orbiters with comet trails — always the full set of 4 (pct text still tracks real pillars) */
  var orbiterCount = 4;
  var tint = [ [200,170,255],[170,200,255],[255,180,220],[190,255,210],[220,190,255],[180,220,255] ];
  for (i=0;i<orbiterCount;i++){
    var orbitR = coreR*2.0 + i*(minWH*0.085);
    var ang = now*0.0006*(1+i*0.35) + i*1.9;
    var px = cx+Math.cos(ang)*orbitR, py = cy+Math.sin(ang)*orbitR*0.62;

    ctx.strokeStyle = rgba(COLOR_BODY, 0.08);
    ctx.beginPath(); ctx.ellipse(cx,cy,orbitR,orbitR*0.62,0,0,Math.PI*2); ctx.stroke();

    var trail = state.trails[i];
    if (!trail){ trail = []; state.trails[i] = trail; }
    trail.push({ x:px, y:py });
    if (trail.length>7) trail.shift();
    var tcol = tint[i%tint.length];
    for (var tI=0;tI<trail.length;tI++){
      var ta = (tI/trail.length)*(0.62+0.18*life);
      ctx.fillStyle = rgba(tcol, ta*0.6);
      ctx.beginPath(); ctx.arc(trail[tI].x, trail[tI].y, 1.6*(tI/trail.length+0.3), 0, Math.PI*2); ctx.fill();
    }
    bloom(ctx, px, py, 6, tcol, 0.55+0.20*life);
    ctx.fillStyle = rgba(tcol, 0.85);
    ctx.beginPath(); ctx.arc(px,py,2.4,0,Math.PI*2); ctx.fill();
  }

  /* periodic radial burst rings at full life */
  if (life>=0.999){
    var ringCyc = (now*0.00045)%1;
    ctx.strokeStyle = rgba(COLOR_BODY, (1-ringCyc)*0.35);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx,cy,coreR*(1.2+ringCyc*4),0,Math.PI*2); ctx.stroke();
  }

  if (burst){
    drawBurst(ctx, cx, cy, Math.min(1,(now-burst.start)/900), COLOR_BODY, minWH*0.55);
  }
}

function drawLook(ctx, w, h, life, now, extra, state, burst){
  if (reduceMotion) now = 0;
  var horizonY = h*0.82, minWH = Math.min(w,h), i;
  /* effLife: the sun/sky's OWN progress, floored high so the sky is always a bright warm dawn, never a dark night */
  var effLife = 0.55+0.45*life;

  var nightTop=[26,18,30], nightBot=[36,24,30];
  var dawnTop=[120,54,22], dawnBot=COLOR_LOOK;
  var skyGrad = ctx.createLinearGradient(0,0,0,horizonY);
  skyGrad.addColorStop(0, rgba(mixColor(nightTop,dawnTop,effLife), 0.85));
  skyGrad.addColorStop(1, rgba(mixColor(nightBot,dawnBot,effLife), 0.85));
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,w,horizonY);

  /* background: stars fading as sun rises */
  var starVis = Math.max(0, 1-effLife*1.3);
  if (starVis>0.01){
    for (i=0;i<state.stars.length;i++){
      var st = state.stars[i];
      var tw = Math.sin(now*0.002+st.phase)*0.5+0.5;
      ctx.fillStyle = rgba([230,230,255], starVis*(0.2+0.5*tw));
      ctx.beginPath(); ctx.arc(st.x*w, st.y*horizonY, st.r, 0, Math.PI*2); ctx.fill();
    }
  }

  /* midground: layered drifting clouds — always present, spread across the whole sky */
  for (i=0;i<state.clouds.length;i++){
    var c = state.clouds[i];
    var cx2 = ((c.x + now*0.00002*c.speed) % 1.3 - 0.15) * w;
    var cy2 = c.y*horizonY;
    var cw2 = minWH*0.26*c.scale;
    ctx.fillStyle = rgba([255,255,255], 0.22+0.10*life);
    ctx.beginPath();
    ctx.ellipse(cx2, cy2, cw2, cw2*0.42, 0, 0, Math.PI*2);
    ctx.ellipse(cx2+cw2*0.5, cy2+cw2*0.08, cw2*0.65, cw2*0.34, 0, 0, Math.PI*2);
    ctx.fill();
  }

  /* ambient light motes scattered across the upper sky */
  for (i=0;i<8;i++){
    var mx = ((i*0.13 + now*0.00003*(1+ (i%3)*0.4)) % 1) * w;
    var my = horizonY * (0.08 + ((i*37)%100)/100 * 0.55);
    var mtw = Math.sin(now*0.0012+i*1.3)*0.5+0.5;
    ctx.fillStyle = rgba([255,235,200], 0.18+0.28*mtw);
    ctx.beginPath(); ctx.arc(mx,my,1.4,0,Math.PI*2); ctx.fill();
  }

  /* ground + horizon reflection */
  ctx.fillStyle = 'rgba(10,7,5,0.32)';
  ctx.fillRect(0,horizonY,w,h-horizonY);
  var reflGrad = ctx.createLinearGradient(0,horizonY,0,horizonY+minWH*0.18);
  reflGrad.addColorStop(0, rgba(COLOR_LOOK, 0.19+0.13*effLife));
  reflGrad.addColorStop(1, rgba(COLOR_LOOK, 0));
  ctx.fillStyle = reflGrad;
  ctx.fillRect(0,horizonY,w,minWH*0.18);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.moveTo(0,horizonY); ctx.lineTo(w,horizonY); ctx.stroke();

  /* foreground: sun — big central focal point, at least ~55% risen, rising further with life */
  var sunX = w/2;
  var sunYbottom = horizonY+minWH*0.10, sunYtop = h*0.34;
  var sunY = sunYbottom + (sunYtop-sunYbottom)*effLife;
  var sunR = (minWH*0.09 + effLife*minWH*0.045) * 1.4;

  bloom(ctx, sunX, sunY, sunR*3.3, COLOR_LOOK, 0.50+0.30*effLife);

  /* rays always present, rotating and brightening with life */
  var rays=12;
  for (i=0;i<rays;i++){
    var ang = (i/rays)*Math.PI*2 + now*0.00018;
    var rlen = sunR*(2.2+effLife*1.4);
    ctx.strokeStyle = rgba(COLOR_LOOK, 0.40+0.18*effLife);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(sunX+Math.cos(ang)*sunR*1.1, sunY+Math.sin(ang)*sunR*1.1);
    ctx.lineTo(sunX+Math.cos(ang)*rlen, sunY+Math.sin(ang)*rlen);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(COLOR_LOOK, 0.7+0.3*effLife);
  ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2); ctx.fill();

  if (life>=0.85){
    for (i=0;i<5;i++){
      var cyc = (now*0.0006+i*0.7)%1;
      var sx = w*0.18+i*(w*0.16);
      var sy = horizonY - cyc*(horizonY-h*0.1);
      ctx.fillStyle = rgba([255,240,210], (1-cyc)*0.55);
      ctx.beginPath(); ctx.arc(sx,sy,1.6,0,Math.PI*2); ctx.fill();
    }
  }

  /* idle event: bird flight */
  if (!reduceMotion){
    if (!state.bird && now > state.nextBirdAt){
      state.bird = { start:now, y:horizonY*(0.25+Math.random()*0.3), dir:Math.random()>0.5?1:-1 };
      state.nextBirdAt = now + 8000+Math.random()*8000;
    }
    if (state.bird){
      var bel = (now-state.bird.start)/3200;
      if (bel>=1){ state.bird = null; }
      else {
        var bx = state.bird.dir>0 ? (-0.1+bel*1.2)*w : (1.1-bel*1.2)*w;
        var by = state.bird.y + Math.sin(bel*Math.PI*4)*4;
        var flap = Math.sin(now*0.02)*3;
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(bx-4,by+flap); ctx.lineTo(bx,by); ctx.lineTo(bx+4,by+flap);
        ctx.stroke();
      }
    }
  }

  if (burst){
    drawBurst(ctx, sunX, sunY, Math.min(1,(now-burst.start)/900), COLOR_LOOK, minWH*0.5);
  }
}

function drawLife(ctx, w, h, life, now, extra, state, burst){
  if (reduceMotion) now = 0;
  var groundY = h*0.82, minWH = Math.min(w,h), i;

  /* full-tile soft green ambient glow so the top isn't empty */
  var skyGrad = ctx.createLinearGradient(0,0,0,groundY);
  skyGrad.addColorStop(0, rgba(mixColor([16,30,20],[40,62,36],life), 0.42));
  skyGrad.addColorStop(1, rgba(mixColor([14,26,16],COLOR_LIFE,life), 0.30));
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,w,groundY);

  /* corner sun with a soft god-ray glow */
  var sx=w*0.82, sy=h*0.18, sr=minWH*0.07;
  bloom(ctx, sx, sy, sr*3.4, [255,224,140], 0.34+0.20*life);
  var rayN=6, ri;
  for (ri=0; ri<rayN; ri++){
    var rAng = (ri/rayN)*Math.PI*2 + now*0.00012;
    ctx.strokeStyle = rgba([255,224,140], 0.14+0.10*life);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx+Math.cos(rAng)*sr*1.2, sy+Math.sin(rAng)*sr*1.2);
    ctx.lineTo(sx+Math.cos(rAng)*sr*3.2, sy+Math.sin(rAng)*sr*3.2);
    ctx.stroke();
  }
  ctx.fillStyle = rgba([255,224,140], 0.72+0.18*life);
  ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();

  /* drifting pollen/spores across the upper garden */
  for (i=0;i<7;i++){
    var polX = ((i*0.17 + now*0.00002*(1+(i%3)*0.5)) % 1) * w;
    var polY = groundY * (0.10 + ((i*53)%100)/100 * 0.55);
    var polTw = Math.sin(now*0.0015+i*1.7)*0.5+0.5;
    ctx.fillStyle = rgba([220,255,220], 0.16+0.26*polTw);
    ctx.beginPath(); ctx.arc(polX,polY,1.3,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = 'rgba(8,12,8,0.22)';
  ctx.fillRect(0,groundY,w,h-groundY);

  var tasksDone = extra.tasksDone||0, tasksTotal = extra.tasksTotal||0;
  /* always at least 5 plants — a full garden — growing to 6 with completed tasks */
  var plantCount = Math.max(5, Math.min(6, tasksTotal>0 ? tasksDone : 5));
  /* grass always sways at full liveliness; life only adds a bit more amplitude */
  var swayAmt = 5+life*3;

  /* background plants — parallax layer behind main garden */
  var bgCount = Math.max(1, Math.floor(plantCount*0.6));
  for (i=0;i<bgCount;i++){
    var bx = (w/(bgCount+1))*(i+1) + minWH*0.06;
    var bsway = Math.sin(now*0.0012+i*2)*swayAmt*0.5;
    var bh = minWH*0.14;
    ctx.strokeStyle = rgba(COLOR_LIFE, 0.30+0.18*life);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(bx, groundY-2);
    ctx.quadraticCurveTo(bx+bsway*0.5, groundY-bh*0.5, bx+bsway, groundY-bh);
    ctx.stroke();
  }

  var slotW = w/(plantCount+1);
  for (i=0;i<plantCount;i++){
    var px = slotW*(i+1);
    var sway = Math.sin(now*0.0018+i*1.1)*swayAmt;
    var kind = i%3;
    var stemH = minWH*(0.16+0.05*(i%3))*1.4;
    ctx.strokeStyle = rgba(COLOR_LIFE, 0.76+0.24*life);
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(px, groundY);
    ctx.quadraticCurveTo(px+sway*0.5, groundY-stemH*0.5, px+sway, groundY-stemH);
    ctx.stroke();

    if (kind===0){
      ctx.fillStyle = rgba(COLOR_LIFE, 0.75+0.25*life);
      ctx.beginPath(); ctx.ellipse(px+sway*0.7, groundY-stemH*0.6, 5, 2.6, sway*0.05, 0, Math.PI*2); ctx.fill();
      if (life>=0.7){
        var petalA = Math.min(1,(life-0.7)/0.3), pi;
        for (pi=0;pi<5;pi++){
          var pAng = (pi/5)*Math.PI*2;
          ctx.fillStyle = rgba([255,255,255], 0.7*petalA);
          ctx.beginPath(); ctx.arc(px+sway+Math.cos(pAng)*4*petalA, groundY-stemH+Math.sin(pAng)*4*petalA, 1.8, 0, Math.PI*2); ctx.fill();
        }
      }
    } else if (kind===1){
      var li;
      for (li=0;li<3;li++){
        var ly = groundY-stemH*(0.3+li*0.25);
        var lx = px+sway*(0.3+li*0.2)+(li%2===0?4:-4);
        ctx.fillStyle = rgba(COLOR_LIFE, 0.70+0.25*life);
        ctx.beginPath(); ctx.ellipse(lx, ly, 4.2, 2, sway*0.05, 0, Math.PI*2); ctx.fill();
      }
    } else {
      ctx.fillStyle = rgba(COLOR_LIFE, 0.70+0.25*life);
      ctx.beginPath(); ctx.arc(px+sway*0.5, groundY-stemH*0.85, 6.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px+sway*0.5-4, groundY-stemH*0.7, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px+sway*0.5+4, groundY-stemH*0.7, 4.5, 0, Math.PI*2); ctx.fill();
    }

    if (life>=1 && i===plantCount-1){
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(px+sway, groundY-stemH, 3.2, 0, Math.PI*2); ctx.fill();
    }
  }

  /* foreground: grass sway, in front of garden — always lively */
  var blades = 14;
  for (i=0;i<blades;i++){
    var gx = (w/blades)*(i+0.5);
    var gsway = Math.sin(now*0.003+i*0.8)*swayAmt*0.6;
    ctx.strokeStyle = rgba(COLOR_LIFE, 0.60+0.24*life);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(gx, groundY+4);
    ctx.quadraticCurveTo(gx+gsway*0.6, groundY-4, gx+gsway, groundY-9);
    ctx.stroke();
  }

  /* idle event: falling leaves */
  if (!reduceMotion){
    if (now > state.nextLeafAt){
      var leaf=null, li2;
      for (li2=0; li2<state.leaves.length; li2++){ if (!state.leaves[li2].active){ leaf=state.leaves[li2]; break; } }
      if (leaf){ leaf.active=true; leaf.x=Math.random()*w; leaf.y=-6; leaf.vy=minWH*0.004; leaf.rot=0; leaf.vr=(Math.random()-0.5)*0.05; }
      state.nextLeafAt = now + 6000+Math.random()*6000;
    }
  }
  for (i=0;i<state.leaves.length;i++){
    var lf = state.leaves[i];
    if (!lf.active) continue;
    if (!reduceMotion){ lf.y += lf.vy; lf.x += Math.sin(now*0.002+i)*0.3; lf.rot += lf.vr; }
    if (lf.y > groundY){ lf.active=false; continue; }
    ctx.save();
    ctx.translate(lf.x, lf.y); ctx.rotate(lf.rot);
    ctx.fillStyle = rgba(COLOR_LIFE, 0.7);
    ctx.beginPath(); ctx.ellipse(0,0,3.2,1.6,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* butterflies always drift (idle event); bees are the high-life pollinator bonus */
  for (i=0;i<state.flies.length;i++){
    var fl = state.flies[i];
    var isBee = fl.kind==='bee';
    if (isBee && life<0.8){ fl.active=false; continue; }
    if (!reduceMotion && !fl.active && Math.random()<(isBee?0.004:0.003)) fl.active=true;
    if (!fl.active) continue;
    var t2 = now*0.0009+fl.phase;
    var fx2 = w*0.15 + (Math.sin(t2)*0.5+0.5)*(w*0.7);
    var fy2 = groundY-minWH*0.22 + Math.sin(t2*3)*8;
    ctx.fillStyle = isBee ? 'rgba(255,210,90,0.75)' : 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(fx2,fy2, isBee?1.8:2.4, 0, Math.PI*2); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.stroke();

  if (burst){
    drawBurst(ctx, w*0.5, groundY-minWH*0.15, Math.min(1,(now-burst.start)/900), COLOR_LIFE, minWH*0.5);
  }
}

function drawMoney(ctx, w, h, life, now, extra, state, burst){
  if (reduceMotion) now = 0;
  var minWH = Math.min(w,h);
  var baseY = h*0.80, i;

  /* full-tile ambient red glow so the top isn't empty */
  var ambGrad = ctx.createLinearGradient(0,0,0,h);
  ambGrad.addColorStop(0, rgba(COLOR_MONEY, 0.10+0.06*life));
  ambGrad.addColorStop(1, rgba(COLOR_MONEY, 0.22+0.10*life));
  ctx.fillStyle = ambGrad;
  ctx.fillRect(0,0,w,h);

  /* background: trading grid — brighter, texture across the whole tile */
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  var gridN=5, gi;
  for (gi=1; gi<gridN; gi++){
    var gy = (h*0.06) + (baseY-h*0.06)*(gi/gridN);
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
  }

  /* ambient embers drifting up across the whole square */
  for (i=0;i<7;i++){
    var emX = ((i*0.15 + now*0.00003*(1+(i%3)*0.4)) % 1) * w;
    var emY = h - ((now*0.00004*(1+(i%2)*0.3) + i*0.2) % 1) * h;
    var emTw = Math.sin(now*0.0013+i*1.6)*0.5+0.5;
    ctx.fillStyle = rgba([255,180,140], 0.14+0.22*emTw);
    ctx.beginPath(); ctx.arc(emX,emY,1.3,0,Math.PI*2); ctx.fill();
  }

  /* midground: scrolling candlestick chart — taller, reaching into the middle of the tile */
  if (!reduceMotion && now > state.nextCandleAt){
    state.candles.push({ h:16+Math.random()*14+life*10, up:Math.random() < (0.45+life*0.3) });
    state.candles.shift();
    state.nextCandleAt = now + 1400;
  }
  var candles = state.candles, n = candles.length, priceTop=[];
  var cw = w/(n*1.6);
  for (i=0;i<n;i++){
    var c = candles[i];
    var x = (i+0.6)*(w/n);
    var trend = (i/n)*life;
    var bodyH = c.h + trend*22;
    var topY = baseY - bodyH - trend*(minWH*0.16);
    var col = c.up ? COLOR_LIFE : COLOR_MONEY;
    ctx.fillStyle = rgba(col, 0.45+0.25*life);
    ctx.fillRect(x-cw/2, topY, cw, bodyH);
    ctx.strokeStyle = rgba(col, 0.65);
    ctx.beginPath(); ctx.moveTo(x, topY-4); ctx.lineTo(x, topY+bodyH+4); ctx.stroke();
    priceTop.push({ x:x, y:topY });
  }
  ctx.strokeStyle = rgba(COLOR_MONEY, 0.55+0.25*life);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (i=0;i<priceTop.length;i++){ if (i===0) ctx.moveTo(priceTop[i].x,priceTop[i].y); else ctx.lineTo(priceTop[i].x,priceTop[i].y); }
  ctx.stroke();

  /* foreground: flame, big central focal point — baseline ~1.5x taller than before */
  var fx=w/2, fy=baseY-minWH*0.34;
  var flameH = minWH*(0.22+life*0.14);
  var flick = Math.sin(now*0.01)*0.15+1;
  bloom(ctx, fx, fy, flameH*2.2, COLOR_MONEY, 0.38+0.22*life);
  ctx.save();
  ctx.translate(fx,fy);
  var fgrad = ctx.createLinearGradient(0,flameH*flick,0,-flameH*0.3);
  fgrad.addColorStop(0, rgba(COLOR_MONEY, 0.34+0.23*life));
  fgrad.addColorStop(0.5, rgba([251,191,110], 0.4+0.35*life));
  fgrad.addColorStop(1, rgba([255,235,160], 0.30+0.20*life));
  ctx.fillStyle = fgrad;
  ctx.beginPath();
  ctx.moveTo(0, flameH*flick);
  ctx.quadraticCurveTo(minWH*0.09, flameH*0.1, 0, -flameH*flick);
  ctx.quadraticCurveTo(-minWH*0.09, flameH*0.1, 0, flameH*flick);
  ctx.fill();
  ctx.restore();

  if (!reduceMotion){
    var sp, spi;
    for (spi=0; spi<state.sparks.length; spi++){
      sp = state.sparks[spi];
      if (!sp.active && Math.random() < 0.045+life*0.035){
        sp.active=true; sp.x=fx+(Math.random()-0.5)*6; sp.y=fy; sp.vx=(Math.random()-0.5)*0.3; sp.vy=-(0.5+Math.random()*0.8)*(0.84+life*0.56); sp.life=1;
      }
      if (!sp.active) continue;
      sp.x += sp.vx; sp.y += sp.vy; sp.life -= 0.018;
      if (sp.life<=0){ sp.active=false; continue; }
      ctx.fillStyle = rgba([255,200,120], sp.life*0.8);
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }

  /* uptrend arrow + rising coins at high life */
  if (life>=0.9){
    ctx.strokeStyle = rgba(COLOR_LIFE, 0.6);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(w*0.2, baseY-6); ctx.lineTo(w*0.8, baseY-minWH*0.3); ctx.stroke();
  }

  /* idle event + high-life reward: coin drop/bounce (shared pool) */
  if (!reduceMotion){
    if (now > state.nextCoinAt){
      var slot, ci;
      for (ci=0; ci<state.coins.length; ci++){ if (!state.coins[ci].active){ slot=state.coins[ci]; break; } }
      if (slot){ slot.active=true; slot.x=w*(0.25+Math.random()*0.5); slot.y=h*0.1; slot.vy=0.2; slot.rot=0; slot.bounces=0; }
      state.nextCoinAt = now + (life>=0.9 ? 3500+Math.random()*3000 : 8000+Math.random()*6000);
    }
    var co, coi;
    for (coi=0; coi<state.coins.length; coi++){
      co = state.coins[coi];
      if (!co.active) continue;
      co.y += co.vy; co.vy += 0.02; co.rot += 0.15;
      if (co.y > baseY){ co.y=baseY; co.vy=-co.vy*0.5; co.bounces++; if (co.bounces>2) co.active=false; }
      ctx.save();
      ctx.translate(co.x, co.y); ctx.rotate(co.rot);
      ctx.fillStyle = 'rgba(255,210,90,0.85)';
      ctx.beginPath(); ctx.ellipse(0,0,4,4*Math.abs(Math.cos(co.rot)),0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  if (burst){
    drawBurst(ctx, fx, fy, Math.min(1,(now-burst.start)/900), COLOR_MONEY, minWH*0.5);
  }
}

/* ---------- SECTIONS ---------- */
var SECTIONS = [
  { id:'body',  sec:'body',  href:'physical.html',   icon:'ti-activity',       name:'Body',  build:buildBody,  draw:drawBody  },
  { id:'look',  sec:'look',  href:'appearance.html', icon:'ti-sparkles',       name:'Look',  build:buildLook,  draw:drawLook  },
  { id:'life',  sec:'life',  href:'life.html',       icon:'ti-home',           name:'Life',  build:buildLife,  draw:drawLife  },
  { id:'money', sec:'money', href:'money.html',      icon:'ti-currency-pound', name:'Money', build:buildMoney, draw:drawMoney }
];

/* ---------- canvas sizing / render registry ---------- */
var PLANETS = {};
var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var rafHandle = null;

function fitCanvas(canvas){
  var rect = canvas.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(1, Math.round(rect.width));
  var h = Math.max(1, Math.round(rect.height));
  canvas.width = w*dpr;
  canvas.height = h*dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx:ctx, w:w, h:h };
}

/* builds the 4 tiles ONCE — canvases and particle state persist
   across data refreshes so idle events / trails / counters carry on */
function buildTiles(){
  var grid = document.getElementById('secGrid');
  grid.innerHTML = '';
  PLANETS = {};
  var t0 = nowMs();

  SECTIONS.forEach(function(s, idx){
    var a = document.createElement('a');
    a.className = 'sec-tile';
    a.setAttribute('data-sec', s.sec);
    a.href = s.href;

    var canvas = document.createElement('canvas');
    canvas.className = 'sec-tile-canvas';

    var topEl = document.createElement('div'); topEl.className = 'sec-tile-top';
    topEl.innerHTML = '<i class="ti '+s.icon+' sec-tile-icon"></i><span class="sec-tile-name">'+s.name+'</span>';

    var pctEl = document.createElement('div'); pctEl.className = 'sec-tile-pct';
    pctEl.textContent = '0%';

    var midEl = document.createElement('div'); midEl.className = 'sec-tile-mid';

    var statEl = document.createElement('div'); statEl.className = 'sec-tile-stat';
    statEl.textContent = '';

    a.appendChild(canvas);
    a.appendChild(topEl);
    a.appendChild(pctEl);
    a.appendChild(midEl);
    a.appendChild(statEl);

    a.style.transitionDelay = (idx*80)+'ms';
    grid.appendChild(a);

    var fit = fitCanvas(canvas);
    PLANETS[s.sec] = {
      sec:s.sec, tileEl:a, canvas:canvas, ctx:fit.ctx, w:fit.w, h:fit.h,
      pctEl:pctEl, statEl:statEl, draw:s.draw,
      life:0, pct:0, displayPct:0, lastShownPct:-1, prevLife:0, extra:{},
      state: initState(s.sec, t0),
      burst:null
    };
  });

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var tiles = grid.querySelectorAll('.sec-tile');
      tiles.forEach(function(t){ t.classList.add('lo-visible'); });
    });
  });
}

/* recomputes scores from localStorage and updates each planet's
   target life/pct — the draw loop eases the visuals toward it */
function updateStats(){
  var date = getActiveDateString();
  SECTIONS.forEach(function(s){
    var res = s.build(date);
    var p = PLANETS[s.sec];
    if (!p) return;
    var increased = res.life > p.life + 0.05;
    p.prevLife = p.life;
    p.life = res.life;
    p.pct = res.pct;
    p.extra = res.extra || {};
    p.statEl.textContent = res.line;
    p.tileEl.classList.toggle('lo-pulse', res.life >= 0.8);
    if (increased){
      p.burst = { start: nowMs() };
    }
  });
  drawAllOnce();
}

function drawAllOnce(now){
  now = now || nowMs();
  var sec;
  for (sec in PLANETS){
    if (!PLANETS.hasOwnProperty(sec)) continue;
    var p = PLANETS[sec];

    var diff = p.pct - p.displayPct;
    if (Math.abs(diff) < 0.4) p.displayPct = p.pct;
    else p.displayPct += diff*0.10;
    var rounded = Math.round(p.displayPct);
    if (p.lastShownPct !== rounded){
      p.pctEl.textContent = rounded + '%';
      p.lastShownPct = rounded;
    }

    /* visuals always render at full richness — real p.life still drives the pct text (above) and the lo-pulse class (in updateStats) */
    try {
      p.ctx.clearRect(0,0,p.w,p.h);
      p.draw(p.ctx, p.w, p.h, 1, now, p.extra, p.state, p.burst);
    } catch (err) {
      p.ctx.clearRect(0,0,p.w,p.h);
      p.ctx.fillStyle = 'rgba(255,80,80,0.95)';
      p.ctx.font = '10px monospace';
      var msg = (err && err.message ? err.message : String(err));
      var words = msg.split(' '), lineTxt = '', yy = 16, wi;
      for (wi=0; wi<words.length; wi++){
        var test = lineTxt ? lineTxt+' '+words[wi] : words[wi];
        if (test.length > 22){ p.ctx.fillText(lineTxt, 8, yy); yy += 12; lineTxt = words[wi]; }
        else { lineTxt = test; }
      }
      if (lineTxt) p.ctx.fillText(lineTxt, 8, yy);
    }

    if (p.burst && now-p.burst.start > 900) p.burst = null;
  }
}

function animLoop(now){
  try { drawAllOnce(now); } catch (e) {}
  rafHandle = requestAnimationFrame(animLoop);
}
function startLoop(){
  if (reduceMotion){ drawAllOnce(); return; }
  if (rafHandle) return;
  rafHandle = requestAnimationFrame(animLoop);
}

function refitAll(){
  var sec;
  for (sec in PLANETS){
    if (!PLANETS.hasOwnProperty(sec)) continue;
    var p = PLANETS[sec];
    var fit = fitCanvas(p.canvas);
    p.ctx = fit.ctx; p.w = fit.w; p.h = fit.h;
  }
  drawAllOnce();
}
window.addEventListener('resize', refitAll);

/* ---------- GOAL TICKER ---------- */
var tickItems=[], tickIdx=0, tickTimer=null;
function buildTick(){
  var date=getActiveDateString();
  var goals=storeGet('goals:'+date)||[];
  var total=goals.length, done=goals.filter(function(g){return g.done;}).length;
  document.getElementById('tickMeta').textContent=done+'/'+total;
  if (total===0){ tickItems=[{t:'No goals set — add one in Todos.'}]; }
  else if (done===total){ tickItems=[{t:'✓ All goals done — solid day.'}]; }
  else { tickItems=goals.filter(function(g){return !g.done;}).map(function(g){return {t:g.text};}); }
}
function tick(){
  buildTick();
  if (tickIdx>=tickItems.length) tickIdx=0;
  document.getElementById('tickTxt').textContent=tickItems[tickIdx].t;
  tickIdx++;
}

/* ---------- boot ---------- */
updateClock(); updateDayRing();
buildTiles(); updateStats(); startLoop();
tick();
setInterval(updateClock, 1000);
setInterval(updateDayRing, 60*1000);
setInterval(tick, 5000);
window.addEventListener('focus', function(){ updateStats(); updateDayRing(); });
window.addEventListener('lo-sync-applied', function(){ updateStats(); tick(); });
</script>
</body>
