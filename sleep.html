<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sleep · Life OS</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<style>
  .slp-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .slp-title { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; letter-spacing:-0.02em; }
  .slp-title i { color:var(--accent); font-size:22px; }
  .slp-date { font-family:var(--mono); font-size:11px; color:var(--text-3); }
  .time-grid { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
  .time-cell { display:flex; flex-direction:column; gap:6px; }
  .time-lbl { font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-3); }
  .time-lbl i { color:var(--accent-lt); margin-right:5px; }
  .time-in { background:rgba(0,0,0,0.24); border:1px solid var(--hair); border-radius:12px; color:var(--text-1);
    font-family:var(--mono); font-size:22px; font-weight:800; text-align:center; padding:14px 8px;
    width:100%; transition:border-color .16s, background .16s; }
  .time-in:focus { outline:none; border-color:rgba(249,115,22,0.5); background:rgba(0,0,0,0.34); }
  .time-in::-webkit-calendar-picker-indicator { filter:invert(0.7) sepia(1) saturate(4) hue-rotate(-10deg); cursor:pointer; }
  .time-arrow { color:var(--text-3); font-size:20px; padding-top:20px; }
  .dur-block { margin-top:20px; text-align:center; }
  .dur-big { font-size:44px; font-weight:800; letter-spacing:-0.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .dur-sub { font-family:var(--mono); font-size:11px; color:var(--text-3); margin-top:6px; }
  .dur-bar { height:8px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; margin:14px 0 8px; }
  .dur-fill { height:100%; width:0; border-radius:999px; transition:width .5s cubic-bezier(.22,1,.36,1), background .3s; }
  .dur-status { font-family:var(--mono); font-size:12px; font-weight:700; }
  .block-lbl { font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--text-3); margin-bottom:10px; }
  .qual-block { margin-top:22px; padding-top:20px; border-top:1px solid var(--hair); }
  .qual-pips { display:flex; gap:10px; }
  .qual-pip { flex:1; height:44px; border-radius:12px; cursor:pointer;
    background:rgba(255,255,255,0.04); border:1px solid var(--hair);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:15px; font-weight:800; color:var(--text-3);
    transition:background .16s, color .16s, border-color .16s, transform .1s; }
  .qual-pip:active { transform:scale(0.94); }
  .qual-pip.on { color:var(--text-1); }
  .qual-label { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text-2); margin-top:10px; text-align:center; }
  .tgt-row { margin-top:22px; padding-top:20px; border-top:1px solid var(--hair);
    display:flex; align-items:center; gap:12px; }
  .tgt-name { font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-3); }
  .tgt-ctrl { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .tgt-btn { width:34px; height:34px; border-radius:10px; cursor:pointer; border:1px solid var(--hair);
    background:rgba(255,255,255,0.04); color:var(--text-1); font-size:20px; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:background .16s; }
  .tgt-btn:hover { background:var(--card-2); }
  .tgt-val { font-family:var(--mono); font-size:16px; font-weight:800; min-width:44px; text-align:center; }
  .trend-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .trend-wrap { width:100%; margin-top:4px; }
  .trend-wrap svg { width:100%; height:auto; display:block; }
  .trend-read { font-family:var(--mono); font-size:11px; color:var(--text-2); text-align:center; margin-top:12px; min-height:14px; }
  .trend-read b { color:var(--text-1); font-weight:800; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="sleepCard">
    <div class="slp-head">
      <div class="slp-title"><i class="ti ti-moon"></i> Sleep</div>
      <div class="slp-date" id="slpDate">—</div>
    </div>
    <div class="time-grid">
      <div class="time-cell">
        <span class="time-lbl"><i class="ti ti-bed"></i>Bed</span>
        <input class="time-in" type="time" id="bedIn">
      </div>
      <span class="time-arrow"><i class="ti ti-arrow-right"></i></span>
      <div class="time-cell">
        <span class="time-lbl"><i class="ti ti-sun"></i>Wake</span>
        <input class="time-in" type="time" id="wakeIn">
      </div>
    </div>
    <div class="dur-block">
      <div class="dur-big" id="durBig">—</div>
      <div class="dur-sub">of <span id="tgtTxt">8h</span> target</div>
      <div class="dur-bar"><div class="dur-fill" id="durFill"></div></div>
      <div class="dur-status" id="durStatus"></div>
    </div>
    <div class="qual-block">
      <div class="block-lbl">Quality</div>
      <div class="qual-pips" id="qualPips"></div>
      <div class="qual-label" id="qualLabel">Not rated</div>
    </div>
    <div class="tgt-row">
      <span class="tgt-name">Target</span>
      <div class="tgt-ctrl">
        <span class="tgt-btn" id="tgtDown">−</span>
        <span class="tgt-val" id="tgtVal">8h</span>
        <span class="tgt-btn" id="tgtUp">+</span>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="trend-head"><span class="block-lbl" style="margin:0;">Last 7 nights</span></div>
    <div class="trend-wrap" id="trendWrap"></div>
    <div class="trend-read" id="trendRead"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script>
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function storeSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function pad2(n){ return String(n).padStart(2,'0'); }
function getActiveDateString(){ var d=new Date(); if(d.getHours()<6) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function KEY(){ return 'sleep:'+getActiveDateString(); }
var TGT_KEY = 'sleep:target';
var QUAL = ['','Poor','Meh','OK','Good','Great'];
function load(){
  var s = storeGet(KEY()) || {};
  if (typeof s.bed !== 'string') s.bed='';
  if (typeof s.wake !== 'string') s.wake='';
  if (typeof s.quality !== 'number') s.quality=0;
  return s;
}
function getTarget(){ var t=storeGet(TGT_KEY); return (typeof t==='number' && t>0) ? t : 8; }
function save(s){ storeSet(KEY(), s); }
function toMin(t){ if(!t||t.indexOf(':')<0) return null; var p=t.split(':'); return (+p[0])*60+(+p[1]); }
function durMins(bed, wake){
  var b=toMin(bed), w=toMin(wake);
  if (b==null || w==null) return null;
  if (w <= b) w += 1440;
  return w - b;
}
function fmtDur(m){ return Math.floor(m/60)+'h '+pad2(m%60)+'m'; }
function render(){
  var s = load(), tgt = getTarget();
  document.getElementById('slpDate').textContent = getActiveDateString();
  document.getElementById('bedIn').value = s.bed;
  document.getElementById('wakeIn').value = s.wake;
  document.getElementById('tgtTxt').textContent = (+tgt.toFixed(1))+'h';
  document.getElementById('tgtVal').textContent = (+tgt.toFixed(1))+'h';
  var m = durMins(s.bed, s.wake);
  var big=document.getElementById('durBig'), fill=document.getElementById('durFill'), status=document.getElementById('durStatus');
  if (m==null){
    big.textContent='—'; big.style.color='var(--text-3)';
    fill.style.width='0'; status.textContent='';
  } else {
    var hrs=m/60;
    big.textContent=fmtDur(m);
    var pct=Math.min(100, hrs/tgt*100);
    fill.style.width=pct+'%';
    var col, msg, diff=hrs-tgt;
    if (hrs>=tgt){ col='var(--success)'; msg='✓ hit target (+'+(+diff.toFixed(1))+'h)'; }
    else if (hrs>=tgt-1){ col='var(--warning)'; msg=(+Math.abs(diff).toFixed(1))+'h short'; }
    else { col='var(--danger)'; msg=(+Math.abs(diff).toFixed(1))+'h short'; }
    big.style.color=col; fill.style.background=col; status.style.color=col; status.textContent=msg;
  }
  var pips=document.getElementById('qualPips'); pips.innerHTML='';
  for (var i=1;i<=5;i++){
    (function(v){
      var p=document.createElement('div'); p.className='qual-pip'+(s.quality>=v && s.quality>0?' on':'');
      p.textContent=v;
      if (s.quality>=v && s.quality>0){
        var c = s.quality<=2?'var(--danger)':(s.quality===3?'var(--warning)':'var(--success)');
        p.style.background='color-mix(in srgb, '+c+' 18%, transparent)';
        p.style.borderColor='color-mix(in srgb, '+c+' 45%, transparent)';
        p.style.color=c;
      }
      p.addEventListener('click', function(){ var st=load(); st.quality = (st.quality===v?0:v); save(st); render(); });
      pips.appendChild(p);
    })(i);
  }
  document.getElementById('qualLabel').textContent = s.quality>0 ? QUAL[s.quality] : 'Not rated';
  renderTrend();
}
var trendSel = -1;
function lastNDates(n){
  var base=new Date(); if(base.getHours()<6) base.setDate(base.getDate()-1);
  var out=[];
  for(var i=n-1;i>=0;i--){ var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-i);
    out.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())); }
  return out;
}
function nightData(date){
  var s=storeGet('sleep:'+date)||{};
  var m=durMins(s.bed, s.wake);
  return { date:date, mins:m, hours:(m==null?null:m/60), quality:s.quality||0 };
}
function renderTrend(){
  var tgt=getTarget();
  var nights=lastNDates(7).map(nightData);
  var logged=nights.filter(function(n){ return n.hours!=null; });
  var maxH=Math.max(tgt+1, 9);
  nights.forEach(function(n){ if(n.hours!=null && n.hours>maxH) maxH=n.hours; });
  var W=320,H=170, padL=6,padR=6,padT=10,padB=24;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  var slot=innerW/nights.length, bw=slot*0.56;
  function yFor(h){ return padT + innerH*(1-h/maxH); }
  var svg='<svg viewBox="0 0 '+W+' '+H+'"><defs>';
  ['success','warning','danger'].forEach(function(c){
    svg+='<linearGradient id="bg-'+c+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--'+c+')" stop-opacity="0.95"/><stop offset="1" stop-color="var(--'+c+')" stop-opacity="0.42"/></linearGradient>';
  });
  svg+='</defs>';
  var ty=yFor(tgt);
  svg+='<line x1="'+padL+'" y1="'+ty.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ty.toFixed(1)+'" stroke="rgba(255,255,255,0.18)" stroke-dasharray="3 3"/>';
  svg+='<text x="'+(W-padR)+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" fill="var(--text-3)" font-family="monospace" font-size="8">'+(+tgt.toFixed(1))+'h</text>';
  nights.forEach(function(n,i){
    var cx=padL+slot*i+slot/2;
    var lbl=new Date(n.date+'T12:00').toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2);
    var x=(cx-bw/2);
    if(n.hours==null){
      svg+='<rect x="'+x.toFixed(1)+'" y="'+(padT+innerH-3).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>';
    } else {
      var by=yFor(n.hours), bh=Math.max(2,(padT+innerH-by));
      var gid = n.hours>=tgt?'bg-success':(n.hours>=tgt-1?'bg-warning':'bg-danger');
      var sel = (i===trendSel)?' stroke="var(--text-1)" stroke-width="1.5"':'';
      svg+='<rect class="tbar" data-idx="'+i+'" x="'+x.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="url(#'+gid+')"'+sel+' style="cursor:pointer"/>';
    }
    svg+='<text x="'+cx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" fill="'+(i===trendSel?'var(--text-1)':'var(--text-3)')+'" font-family="monospace" font-size="8.5">'+lbl+'</text>';
  });
  svg+='</svg>';
  document.getElementById('trendWrap').innerHTML=svg;
  var read=document.getElementById('trendRead');
  if(trendSel>=0 && nights[trendSel] && nights[trendSel].hours!=null){
    var sn=nights[trendSel];
    var full=new Date(sn.date+'T12:00').toLocaleDateString('en-GB',{weekday:'long'});
    read.innerHTML='<b>'+full+'</b> · '+fmtDur(sn.mins)+(sn.quality?' · '+QUAL[sn.quality]:'');
  } else if(logged.length){
    var avg=logged.reduce(function(a,b){ return a+b.mins; },0)/logged.length;
    read.innerHTML='Avg <b>'+fmtDur(Math.round(avg))+'</b> over '+logged.length+' night'+(logged.length===1?'':'s')+' · tap a bar';
  } else {
    read.textContent='Log a few nights to see your trend.';
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tbar'), function(b){
    b.addEventListener('click', function(){ var i=+b.getAttribute('data-idx'); trendSel=(trendSel===i?-1:i); renderTrend(); });
  });
}
document.getElementById('bedIn').addEventListener('input', function(e){ var s=load(); s.bed=e.target.value; save(s); render(); });
document.getElementById('wakeIn').addEventListener('input', function(e){ var s=load(); s.wake=e.target.value; save(s); render(); });
document.getElementById('tgtDown').addEventListener('click', function(){ var t=Math.max(4, getTarget()-0.5); storeSet(TGT_KEY, t); render(); });
document.getElementById('tgtUp').addEventListener('click', function(){ var t=Math.min(12, getTarget()+0.5); storeSet(TGT_KEY, t); render(); });
render();
window.addEventListener('lo-sync-applied', render);
window.addEventListener('focus', render);
</script>
</body>
</html>
