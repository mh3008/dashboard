<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plants · Life OS</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<style>
  /* ============================================================
     GLASS MODULE CARDS — same visual language as physical.html:
     frosted glass, animated iridescent gradient rim.
     ============================================================ */
  .mod-card {
    position: relative; border-radius: 20px; padding:20px;
    background: var(--m-bg, rgba(107,227,164,0.05));
    border: 1px solid var(--m-bd, rgba(107,227,164,0.16));
    backdrop-filter: blur(26px) saturate(1.4);
    -webkit-backdrop-filter: blur(26px) saturate(1.4);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.10);
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease-out, transform .5s ease-out;
  }
  .mod-card.lo-visible { opacity: 1; transform: translateY(0); }
  .mod-card::after {
    content:''; position:absolute; inset:0; border-radius:20px; padding:1.5px;
    background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3), var(--g2), var(--g1));
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: bodyBorderShift 8s ease infinite;
    opacity: 0.65; pointer-events: none; z-index: 2;
  }
  @keyframes bodyBorderShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mod-card::after { animation: none; }
    .mod-card { transition: none; opacity: 1; transform: none; }
  }
  .mod-hero { --g1:#6be3a4; --g2:#38bdf8; --g3:#a3e635; --m-bg:rgba(107,227,164,0.045); --m-bd:rgba(107,227,164,0.18); --m-accent:#6be3a4; }

  /* ---- HERO ---- */
  .plt-hero { margin-bottom: 12px; }
  .plt-title-wrap { display:flex; align-items:center; gap:12px; margin-bottom:16px; position:relative; z-index:1; }
  .plt-hero-icon { font-size:28px; color:#6be3a4; }
  .plt-title {
    font-size:32px; font-weight:800; letter-spacing:-0.03em; line-height:1;
    background: linear-gradient(120deg, #6be3a4, #38bdf8, #a3e635, #6be3a4);
    background-size: 300% 300%;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    animation: pltTitleShift 10s ease infinite;
  }
  @keyframes pltTitleShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (prefers-reduced-motion: reduce) { .plt-title { animation: none; } }

  .mist-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; position:relative; z-index:1; }
  .mist-lbl { font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-3); }
  .mist-pips { display:flex; gap:8px; }
  .mist-pip {
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(255,255,255,0.04); border:1px solid var(--hair); color:var(--text-3); font-size:18px;
    transition:background .16s, border-color .16s, color .16s, box-shadow .16s, transform .1s;
  }
  .mist-pip:active { transform:scale(0.92); }
  .mist-pip.on { background:rgba(56,189,248,0.14); border-color:rgba(56,189,248,0.5); color:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,0.35); }

  .plt-summary { font-family:var(--mono); font-size:11px; color:var(--text-3); position:relative; z-index:1; }
  .plt-summary b { color:var(--text-1); font-weight:800; }

  /* ---- PER-PLANT CARDS ---- */
  .plt-card { margin-top:12px; }
  .plt-top { display:flex; align-items:center; gap:14px; position:relative; z-index:1; }
  .ring-wrap { position:relative; width:64px; height:64px; flex-shrink:0; }
  .plt-ring { width:64px; height:64px; transform:rotate(-90deg); display:block; }
  .ring-track { fill:none; stroke:rgba(255,255,255,0.08); stroke-width:5; }
  .ring-fill { fill:none; stroke-width:5; stroke-linecap:round; }
  .ring-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:800; font-size:15px; }

  .plt-info { flex:1; min-width:0; }
  .plt-name { font-size:16px; font-weight:800; letter-spacing:-0.01em; }
  .plt-latin { font-family:var(--mono); font-size:10px; color:var(--text-3); font-style:italic; margin-top:2px; }
  .plt-sched { font-family:var(--mono); font-size:10px; color:var(--text-3); margin-top:4px; }
  .plt-sched i { font-size:11px; margin-right:3px; vertical-align:-1px; }

  .soak-btn { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:12px;
    cursor:pointer; border:1px solid rgba(56,189,248,0.3); background:rgba(56,189,248,0.08);
    color:#38bdf8; font-family:var(--mono); font-size:12px; font-weight:700;
    transition:background .16s, transform .1s, border-color .16s; }
  .soak-btn:hover { background:rgba(56,189,248,0.16); border-color:rgba(56,189,248,0.5); }
  .soak-btn:active { transform:scale(0.95); }
  .soak-btn i { font-size:18px; }
  .soak-btn.just { background:rgba(107,227,164,0.12); border-color:rgba(107,227,164,0.4); color:var(--success); pointer-events:none; }

  .plt-status { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1; }
  .plt-tag { font-family:var(--mono); font-size:10px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:rgba(255,255,255,0.04); border:1px solid var(--hair); color:var(--text-2); }
  .plt-tag.due { background:rgba(249,115,22,0.10); border-color:rgba(249,115,22,0.35); color:var(--accent-lt); }
  .plt-tag.overdue { background:rgba(239,68,68,0.10); border-color:rgba(239,68,68,0.35); color:var(--danger); }
  .plt-tag.ok { background:rgba(107,227,164,0.08); border-color:rgba(107,227,164,0.25); color:var(--success); }

  .mist-note { margin-top:12px; font-family:var(--mono); font-size:11px; color:var(--text-2); position:relative; z-index:1; }
  .mist-note i { color:#38bdf8; margin-right:5px; }

  .grp { margin-top:14px; position:relative; z-index:1; }
  .grp-head { display:flex; align-items:center; gap:8px; cursor:pointer; padding:4px 0; }
  .grp-caret { font-family:var(--mono); font-size:11px; color:var(--text-3); transition:transform .2s; }
  .grp-caret.open { transform:rotate(90deg); }
  .grp-name { font-family:var(--mono); font-size:10.5px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-2); }
  .grp-body { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .grp-body.collapsed { display:none; }
  .plt-tip { font-size:12px; color:var(--text-2); line-height:1.5; }
  .plt-tip i { color:var(--text-3); font-size:12px; margin-right:5px; }

  /* ---- MIST STREAK ---- */
  .mist-streak-card { --g1:#38bdf8; --g2:#6be3a4; --g3:#a3e635; --m-bg:rgba(56,189,248,0.045); --m-bd:rgba(56,189,248,0.16); --m-accent:#38bdf8; }
  .heat-row { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .heat-label { width:52px; flex-shrink:0; font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-2); }
  .heat-grid { display:grid; grid-template-columns:repeat(30, 1fr); gap:3px; flex:1; }
  .heat-cell {
    aspect-ratio:1/1; border-radius:3px; background:rgba(255,255,255,0.05); cursor:pointer;
    transition:transform .1s, outline-color .15s;
    outline:1.5px solid transparent; outline-offset:1px;
  }
  .heat-cell:hover { transform:scale(1.3); }
  .heat-cell.sel { outline-color:var(--text-1); }
  .heat-streak { font-family:var(--mono); font-size:9px; color:var(--text-3); flex-shrink:0; width:64px; text-align:right; line-height:1.5; }
  .heat-streak b { color:var(--text-1); }
  .mist-detail { font-family:var(--mono); font-size:11px; color:var(--text-2); margin-top:16px; min-height:14px; position:relative; z-index:1; }
  .mist-detail b { color:var(--text-1); font-weight:800; }

  .plt-note { font-family:var(--mono); font-size:10px; color:var(--text-3); text-align:center; margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">

  <!-- HERO -->
  <div class="card mod-card mod-hero plt-hero lo-visible" id="heroCard">
    <div class="plt-title-wrap">
      <i class="ti ti-plant-2 plt-hero-icon"></i>
      <div class="plt-title">Plants</div>
    </div>
    <div class="mist-row">
      <span class="mist-lbl">Mist</span>
      <div class="mist-pips" id="mistPips"></div>
    </div>
    <div class="plt-summary" id="pltSummary">—</div>
  </div>

  <!-- PLANT CARDS -->
  <div id="pltList"></div>

  <!-- MIST STREAK -->
  <div class="section-title">Mist streak</div>
  <div class="card mod-card mist-streak-card lo-visible" id="mistStreakCard">
    <div class="heat-row">
      <div class="heat-label">Mist</div>
      <div class="heat-grid" id="mistHeatGrid"></div>
      <div class="heat-streak" id="mistHeatStreak"></div>
    </div>
    <div class="mist-detail" id="mistDetail">Tap a day to see the count.</div>
  </div>

  <div class="plt-note">Tap a droplet pip when you mist. Tap Soak when you deep-water. The ring tracks days since your last soak — misting is a daily top-up and doesn't reset it.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script>
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function storeSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayDate(){ var d=new Date(); if(d.getHours()<6) d.setDate(d.getDate()-1); return d; }
function todayStr(){ return fmtDate(todayDate()); }
function fmtFull(date){ return new Date(date+'T12:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'}); }
function dayDiff(a,b){
  var pa=a.split('-'),pb=b.split('-');
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000);
}
function lastNDates(n){
  var base = todayDate();
  var out = [];
  for (var i=n-1;i>=0;i--){ var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-i); out.push(fmtDate(d)); }
  return out;
}
function hexToRgba(hex, a){
  var h = hex.replace('#','');
  var r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

var STORE_KEY = 'plants:data';
function mistKey(date){ return 'plants:mist:'+date; }

var PLANTS = [
  { id:'peace', name:'Peace Lily', latin:'Spathiphyllum', emoji:'🌿', soakDays:7, hue:'#6be3a4',
    mist:'Mist fronds daily — loves humidity. Soil can stay lightly moist.',
    tips:['Low-to-medium indirect light, tolerates shade','Drooping leaves mean thirsty — it recovers fast','Drench until water runs out the bottom, empty the saucer'] },
  { id:'areca', name:'Areca Palm', latin:'Dypsis lutescens', emoji:'🌴', soakDays:6, hue:'#38bdf8',
    mist:'Mist fronds daily — brown tips mean the air is too dry.',
    tips:['Bright indirect light, not harsh direct sun','Thirstiest plant here — keep the root ball consistently moist, never let it dry fully','Soak deeply every 6 days; surface spraying alone leaves the lower roots dry'] },
  { id:'dracaena', name:'Dracaena Marginata', latin:'Dracaena marginata', emoji:'🌱', soakDays:14, hue:'#a3e635',
    mist:'Light mist is fine — not essential.',
    tips:['Bright indirect light','Let soil dry between soaks','Sensitive to fluoride in tap water — filtered is better'] },
  { id:'aloe', name:'Aloe Vera', latin:'Aloe barbadensis', emoji:'🌵', soakDays:21, hue:'#facc15',
    mist:'Light mist only. Never let water sit in the leaf rosette — it rots.',
    tips:['Full sun windowsill is ideal','Soak deeply then let it go completely dry for weeks','Well-draining pot — never leave it standing in water','Underwatering is far safer than overwatering'] },
  { id:'haworthia', name:'Haworthia', latin:'Haworthia fasciata', emoji:'🪴', soakDays:21, hue:'#5eead4',
    mist:'Mist the soil, not the centre. Water pooling in the rosette rots the crown.',
    tips:['Bright light, tolerates direct sun','Extremely drought tolerant','Soak fully then leave completely dry until the soil has no moisture at all','Slow grower — that is normal'] }
];

/* ============================================================
   MIGRATION — 'lastWatered' -> 'lastSoak', 'yucca' -> 'areca'.
   Non-destructive: never overwrites an existing lastSoak, never
   drops a record that isn't explicitly superseded.
   ============================================================ */
function migrateData(){
  var d = storeGet(STORE_KEY);
  if (!d || typeof d !== 'object') d = {};
  var changed = false;
  Object.keys(d).forEach(function(id){
    var rec = d[id];
    if (rec && typeof rec === 'object'){
      if (rec.lastWatered && !rec.lastSoak){ rec.lastSoak = rec.lastWatered; changed = true; }
      if ('lastWatered' in rec){ delete rec.lastWatered; changed = true; }
    }
  });
  if (d.yucca){
    if (!d.areca){ d.areca = d.yucca; changed = true; }
    delete d.yucca; changed = true;
  }
  if (changed) storeSet(STORE_KEY, d);
  return d;
}

function loadData(){
  var d = migrateData();
  PLANTS.forEach(function(p){ if (!d[p.id]) d[p.id] = { lastSoak:null }; });
  return d;
}
function saveData(d){ storeSet(STORE_KEY, d); }

function loadMist(date){
  var m = storeGet(mistKey(date));
  if (!m || typeof m !== 'object') m = { count:0 };
  if (typeof m.count !== 'number') m.count = 0;
  return m;
}
function saveMist(date, count){ storeSet(mistKey(date), { count:count }); }

/* ============================================================
   RING — small inline SVG string, dasharray/dashoffset computed
   per plant so the arc matches its own soak progress.
   ============================================================ */
function ringSvg(pct, col){
  var r=28, c=2*Math.PI*r;
  var clamped = Math.min(100, Math.max(0, pct));
  var off = c*(1-clamped/100);
  return '<svg class="plt-ring" viewBox="0 0 64 64">'+
    '<circle class="ring-track" cx="32" cy="32" r="'+r+'"></circle>'+
    '<circle class="ring-fill" cx="32" cy="32" r="'+r+'" stroke="'+col+'" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"></circle>'+
    '</svg>';
}

function plantCard(p, data){
  var rec = data[p.id] || {};
  var last = rec.lastSoak;
  var today = todayStr();
  var sinceSoak = last ? dayDiff(last, today) : null;
  var daysLeft = (sinceSoak != null) ? p.soakDays - sinceSoak : null;
  var justSoaked = (last === today);

  var statusClass, statusText;
  if (!last){
    statusClass = 'due'; statusText = 'never soaked — soak now';
  } else if (justSoaked){
    statusClass = 'ok'; statusText = 'soaked today ✓';
  } else if (daysLeft != null && daysLeft <= 0){
    statusClass = 'overdue'; statusText = Math.abs(daysLeft) + ' day' + (Math.abs(daysLeft)===1?'':'s') + ' overdue';
  } else if (daysLeft != null && daysLeft <= 2){
    statusClass = 'due'; statusText = 'due ' + (daysLeft === 0 ? 'today' : (daysLeft === 1 ? 'tomorrow' : 'in ' + daysLeft + ' days'));
  } else {
    statusClass = 'ok'; statusText = daysLeft + ' days until next soak';
  }

  var pct = !last ? 100 : Math.min(100, (sinceSoak / p.soakDays) * 100);
  var ringCol = pct >= 100 ? 'var(--danger)' : (pct >= 75 ? 'var(--warning)' : 'var(--success)');
  var overdue = !last || (daysLeft != null && daysLeft <= 0);
  var ringNum = overdue ? '!' : daysLeft;

  var card = document.createElement('div'); card.className = 'card mod-card plt-card lo-visible';
  card.id = 'plt-' + p.id;
  card.style.setProperty('--g1', p.hue);
  card.style.setProperty('--g2', '#38bdf8');
  card.style.setProperty('--g3', '#a3e635');
  card.style.setProperty('--m-bg', hexToRgba(p.hue, 0.05));
  card.style.setProperty('--m-bd', hexToRgba(p.hue, 0.18));
  card.style.setProperty('--m-accent', p.hue);

  var top = document.createElement('div'); top.className = 'plt-top';

  var ringWrap = document.createElement('div'); ringWrap.className = 'ring-wrap';
  ringWrap.innerHTML = ringSvg(pct, ringCol) + '<div class="ring-num">' + ringNum + '</div>';
  top.appendChild(ringWrap);

  var info = document.createElement('div'); info.className = 'plt-info';
  var nm = document.createElement('div'); nm.className = 'plt-name'; nm.textContent = p.name;
  var lt = document.createElement('div'); lt.className = 'plt-latin'; lt.textContent = p.latin;
  var sc = document.createElement('div'); sc.className = 'plt-sched';
  sc.innerHTML = '<i class="ti ti-calendar-repeat"></i>Soak every ' + p.soakDays + ' days';
  info.appendChild(nm); info.appendChild(lt); info.appendChild(sc);
  top.appendChild(info);

  var btn = document.createElement('div'); btn.className = 'soak-btn' + (justSoaked ? ' just' : '');
  btn.innerHTML = '<i class="ti ti-droplet"></i>' + (justSoaked ? 'Done ✓' : 'Soak');
  if (!justSoaked){
    (function(pid){
      btn.addEventListener('click', function(){
        var d = loadData();
        d[pid].lastSoak = todayStr();
        saveData(d); render();
      });
    })(p.id);
  }
  top.appendChild(btn);
  card.appendChild(top);

  var statRow = document.createElement('div'); statRow.className = 'plt-status';
  var tag = document.createElement('span'); tag.className = 'plt-tag ' + statusClass; tag.textContent = statusText;
  statRow.appendChild(tag);
  if (last && !justSoaked){
    var ago = document.createElement('span'); ago.className = 'plt-tag';
    ago.textContent = 'last: ' + sinceSoak + 'd ago';
    statRow.appendChild(ago);
  }
  card.appendChild(statRow);

  var mistNote = document.createElement('div'); mistNote.className = 'mist-note';
  mistNote.innerHTML = '<i class="ti ti-spray"></i>' + p.mist;
  card.appendChild(mistNote);

  var grp = document.createElement('div'); grp.className = 'grp';
  var head = document.createElement('div'); head.className = 'grp-head';
  head.innerHTML = '<span class="grp-caret">&gt;</span><span class="grp-name">Care</span>';
  var body = document.createElement('div'); body.className = 'grp-body collapsed';
  p.tips.forEach(function(t){
    var tip = document.createElement('div'); tip.className = 'plt-tip';
    tip.innerHTML = '<i class="ti ti-leaf"></i>' + t;
    body.appendChild(tip);
  });
  head.addEventListener('click', function(){
    var collapsed = body.classList.toggle('collapsed');
    head.querySelector('.grp-caret').classList.toggle('open', !collapsed);
  });
  grp.appendChild(head); grp.appendChild(body);
  card.appendChild(grp);

  return { el:card, statusClass:statusClass };
}

/* ============================================================
   TODAY'S MIST PIPS
   ============================================================ */
function renderMistPips(count){
  var host = document.getElementById('mistPips'); host.innerHTML = '';
  for (var i=1;i<=3;i++){
    (function(n){
      var on = count >= n;
      var pip = document.createElement('span'); pip.className = 'mist-pip' + (on ? ' on' : '');
      pip.innerHTML = '<i class="ti ' + (on ? 'ti-droplet-filled' : 'ti-droplet') + '"></i>';
      pip.addEventListener('click', function(){
        var date = todayStr();
        var m = loadMist(date);
        var newCount = (m.count === n) ? n - 1 : n;
        if (newCount < 0) newCount = 0;
        saveMist(date, newCount);
        render();
      });
      host.appendChild(pip);
    })(i);
  }
}

/* ============================================================
   MIST STREAK — 30-day heatmap of plants:mist:<date> counts.
   ============================================================ */
var mistSelIdx = -1;
function renderMistHeat(){
  var dates = lastNDates(30);
  var counts = dates.map(function(d){ return loadMist(d).count; });

  var grid = document.getElementById('mistHeatGrid'); grid.innerHTML = '';
  counts.forEach(function(c, idx){
    var cell = document.createElement('div'); cell.className = 'heat-cell' + (idx===mistSelIdx ? ' sel' : '');
    cell.setAttribute('data-idx', idx);
    if (c >= 3){ cell.style.background = '#38bdf8'; cell.style.boxShadow = '0 0 5px rgba(56,189,248,0.6)'; }
    else if (c >= 1){ cell.style.background = 'rgba(56,189,248,0.45)'; }
    else { cell.style.background = 'rgba(255,255,255,0.05)'; }
    cell.addEventListener('click', function(){
      mistSelIdx = (mistSelIdx === idx) ? -1 : idx;
      renderMistHeat();
    });
    grid.appendChild(cell);
  });

  var curStreak = 0, bestStreak = 0, run = 0, i;
  for (i=0;i<counts.length;i++){ if (counts[i] >= 1){ run++; if (run > bestStreak) bestStreak = run; } else { run = 0; } }
  for (i=counts.length-1;i>=0;i--){ if (counts[i] >= 1) curStreak++; else break; }
  document.getElementById('mistHeatStreak').innerHTML = '<b>' + curStreak + '</b> now<br>' + bestStreak + ' best';

  var detail = document.getElementById('mistDetail');
  if (mistSelIdx < 0){
    detail.textContent = 'Tap a day to see the count.';
  } else {
    var date = dates[mistSelIdx], n = counts[mistSelIdx];
    detail.innerHTML = '<b>' + fmtFull(date) + '</b> · ' + n + ' mist' + (n===1?'':'s');
  }
}

function render(){
  var data = loadData();
  var mistToday = loadMist(todayStr());
  renderMistPips(mistToday.count);

  var list = document.getElementById('pltList'); list.innerHTML = '';
  var dueCount = 0, okCount = 0, overdueCount = 0;
  PLANTS.forEach(function(p){
    var built = plantCard(p, data);
    if (built.statusClass === 'overdue') overdueCount++;
    else if (built.statusClass === 'due') dueCount++;
    else okCount++;
    list.appendChild(built.el);
  });

  var sum = document.getElementById('pltSummary');
  var parts = [];
  if (overdueCount) parts.push('<b>' + overdueCount + '</b> overdue');
  if (dueCount) parts.push('<b>' + dueCount + '</b> due soon');
  if (okCount) parts.push('<b>' + okCount + '</b> happy');
  sum.innerHTML = parts.length ? parts.join(' · ') : 'All good — nothing needs water.';

  renderMistHeat();
}

render();
window.addEventListener('lo-sync-applied', render);
window.addEventListener('focus', render);
</script>
</body>
</html>
