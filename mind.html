<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mind · Life OS</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<style>
  /* ============================================================
     GLASS MODULE CARDS — same visual language as life.html/
     physical.html: frosted glass, animated iridescent gradient rim.
     ============================================================ */
  .mod-card {
    position: relative; border-radius: 20px; padding:20px;
    background: var(--m-bg, rgba(248,113,113,0.05));
    border: 1px solid var(--m-bd, rgba(248,113,113,0.16));
    backdrop-filter: blur(26px) saturate(1.4);
    -webkit-backdrop-filter: blur(26px) saturate(1.4);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.10);
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease-out, transform .5s ease-out;
  }
  .mod-card.lo-visible { opacity: 1; transform: translateY(0); }
  .mod-card::after {
    content:''; position:absolute; inset:0; border-radius:20px; padding:1.5px;
    background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3), var(--g2), var(--g1));
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: bodyBorderShift 8s ease infinite;
    opacity: 0.65; pointer-events: none; z-index: 2;
  }
  @keyframes bodyBorderShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mod-card::after { animation: none; }
    .mod-card { transition: none; opacity: 1; transform: none; }
  }
  .mod-mind { --g1:#f87171; --g2:#fb923c; --g3:#ec4899; --m-bg:rgba(248,113,113,0.045); --m-bd:rgba(248,113,113,0.18); --m-accent:#f87171; }

  /* ---- HERO ---- */
  .body-hero { padding: 22px; margin-bottom: 12px; }
  .hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; position:relative; z-index:1; }
  .body-title-wrap { display:flex; align-items:center; gap:12px; }
  .body-hero-icon { font-size:28px; color:#f87171; }
  .body-title {
    font-size:32px; font-weight:800; letter-spacing:-0.03em; line-height:1;
    background: linear-gradient(120deg, #f87171, #fb923c, #ec4899, #f87171);
    background-size: 300% 300%;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    animation: mindTitleShift 10s ease infinite;
  }
  @keyframes mindTitleShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (prefers-reduced-motion: reduce) { .body-title { animation: none; } }
  .body-date { font-family:var(--mono); font-size:11px; color:var(--text-3); padding-top:7px; white-space:nowrap; }

  .pillar-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; position:relative; z-index:1; }
  .pillar-chip {
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:14px;
    background:rgba(255,255,255,0.03); border:1px solid var(--hair);
    transition:background .2s, border-color .2s, box-shadow .2s;
  }
  .pillar-chip i { font-size:18px; color:var(--text-3); transition:color .2s; }
  .pillar-chip span { font-size:9.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-3); transition:color .2s; }
  .pillar-chip.hit { background:rgba(248,113,113,0.12); border-color:rgba(248,113,113,0.45); box-shadow:0 0 16px rgba(248,113,113,0.25); }
  .pillar-chip.hit i, .pillar-chip.hit span { color:#ffd9d9; }

  .pillar-bar { height:8px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; margin:16px 0 8px; position:relative; z-index:1; }
  .pillar-fill {
    height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,#f87171,#fb923c,#ec4899); background-size:200% 100%;
    transition:width .5s cubic-bezier(.22,1,.36,1);
  }
  .pillar-summary { font-family:var(--mono); font-size:12px; color:var(--text-2); font-weight:700; position:relative; z-index:1; }

  /* ---- shared module head ---- */
  .mod-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; position:relative; z-index:1; }
  .mod-title { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:800; letter-spacing:-0.02em; }
  .mod-title i { color:var(--m-accent); font-size:20px; }
  .mod-count { font-family:var(--mono); font-size:13px; color:var(--text-2); }
  .mod-count.all-done { color:var(--success); }
  .mod-count b { color:var(--text-1); font-weight:800; }
  .mod-body { position:relative; z-index:1; }
  .block-lbl { font-family:var(--mono); font-size:9.5px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-3); }

  .mod-footer-link {
    display:block; text-align:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--hair);
    font-family:var(--mono); font-size:11px; font-weight:700; color:var(--text-2); text-decoration:none;
    position:relative; z-index:1; transition:color .16s;
  }
  .mod-footer-link:hover { color:var(--text-1); }

  /* ---- LEARN QUEUE ---- */
  .item-list { display:flex; flex-direction:column; gap:8px; position:relative; z-index:1; }
  .item {
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
    background:rgba(255,255,255,0.035); border:1px solid var(--hair); transition:background .18s, opacity .18s; cursor:pointer;
    touch-action: manipulation; -webkit-user-select:none; user-select:none;
  }
  .item:hover { background:var(--card-2); }
  .item.done { opacity:0.5; background:rgba(248,113,113,0.06); }
  .item.done .item-txt { text-decoration:line-through; text-decoration-color:rgba(255,255,255,0.4); }
  .cb { width:22px; height:22px; border-radius:7px; border:1.5px solid rgba(255,255,255,0.18);
    background:rgba(0,0,0,0.2); flex-shrink:0; position:relative; transition:background .18s, box-shadow .18s, border-color .18s; }
  .item.done .cb { background:#f87171; border-color:#f87171; box-shadow:0 0 12px rgba(248,113,113,0.4); }
  .item.done .cb::after { content:''; position:absolute; left:7px; top:3px; width:5px; height:10px;
    border:solid #0a0a0b; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .item-txt { font-size:14px; }
  .td-empty { text-align:center; color:var(--text-3); font-family:var(--mono); font-size:12px; padding:20px 0 6px; position:relative; z-index:1; }

  .mind-add { display:flex; gap:8px; margin-top:12px; position:relative; z-index:1; }
  .mind-in { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--hair);
    background:rgba(0,0,0,0.22); color:var(--text-1); font-size:14px; font-family:var(--font); outline:none;
    transition:border-color .16s; }
  .mind-in::placeholder { color:var(--text-3); }
  .mind-in:focus { border-color:rgba(248,113,113,0.5); }
  .mind-btn { padding:12px 18px; border-radius:12px; border:none; background:#f87171;
    color:#1a0a0a; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0; transition:transform .1s; }
  .mind-btn:active { transform:scale(0.96); }

  /* ---- TILE GRID (nav) ---- */
  .tile-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:12px; }
  .tile {
    aspect-ratio:1/1; padding:16px; display:flex; flex-direction:column;
    text-decoration:none; color:inherit; cursor:pointer;
    transition: opacity .5s ease-out, transform .5s ease-out, border-color .2s;
  }
  .tile-top { display:flex; align-items:center; gap:8px; position:relative; z-index:1; }
  .tile-top i { font-size:18px; color:var(--m-accent); }
  .tile-top span { font-size:13px; font-weight:800; letter-spacing:-0.01em; }
  .tile-stat {
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:var(--mono); font-size:15px; font-weight:800; color:var(--text-2);
    position:relative; z-index:1;
  }
  .tile.soon { opacity:0.4; pointer-events:none; }
  .tile-wide { grid-column:1/-1; aspect-ratio:auto; flex-direction:row; align-items:center; justify-content:space-between; padding:18px 20px; }
  .tile-wide .tile-stat { flex:none; }

  /* ---- CONSISTENCY ---- */
  .cons-overall { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; position:relative; z-index:1; }
  .cons-overall-num {
    font-size:38px; font-weight:800; letter-spacing:-0.03em;
    background:linear-gradient(120deg,#f87171,#fb923c,#ec4899); background-size:200% 200%;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  }
  .cons-overall-lbl { font-family:var(--mono); font-size:11px; color:var(--text-3); }
  .heat-row { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .heat-label { width:52px; flex-shrink:0; font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-2); }
  .heat-grid { display:grid; grid-template-columns:repeat(30, 1fr); gap:3px; flex:1; }
  .heat-cell {
    aspect-ratio:1/1; border-radius:3px; background:rgba(255,255,255,0.05); cursor:pointer;
    transition:transform .1s, outline-color .15s;
    outline:1.5px solid transparent; outline-offset:1px;
  }
  .heat-cell:hover { transform:scale(1.3); }
  .heat-cell.sel { outline-color:var(--text-1); }
  .heat-streak { font-family:var(--mono); font-size:9px; color:var(--text-3); flex-shrink:0; width:64px; text-align:right; line-height:1.5; }
  .heat-streak b { color:var(--text-1); }
  .cons-detail { font-family:var(--mono); font-size:11px; color:var(--text-2); margin-top:16px; min-height:14px; position:relative; z-index:1; }
  .cons-detail b { color:var(--text-1); font-weight:800; }
</style>
</head>
<body>

<div class="wrap">

  <!-- HERO -->
  <div class="card mod-card mod-mind body-hero" id="heroCard">
    <div class="hero-top">
      <div class="body-title-wrap">
        <i class="ti ti-brain body-hero-icon"></i>
        <div class="body-title">Mind</div>
      </div>
      <div class="body-date" id="heroDate">—</div>
    </div>
    <div class="pillar-row" id="pillarRow"></div>
    <div class="pillar-bar"><div class="pillar-fill" id="pillarFill"></div></div>
    <div class="pillar-summary" id="pillarSummary">0 / 3 clear</div>
  </div>

  <!-- LEARN QUEUE -->
  <div class="section-title">Learn Queue</div>
  <div class="card mod-card mod-mind" id="learnCard">
    <div class="mod-head">
      <div class="mod-title"><i class="ti ti-books"></i> Learn</div>
      <div class="mod-count" id="learnCount">0 done today</div>
    </div>
    <div class="mod-body">
      <div class="item-list" id="learnList"></div>
      <div class="mind-add">
        <input class="mind-in" id="learnIn" type="text" placeholder="Add something to learn…" maxlength="120">
        <button class="mind-btn" id="learnBtn">Add</button>
      </div>
      <a class="mod-footer-link" href="learn.html">Manage queue →</a>
    </div>
  </div>

  <!-- NAV TILES -->
  <div class="section-title">More</div>
  <div class="tile-grid">
    <a class="mod-card mod-mind tile" href="learn.html" id="tileLearn">
      <div class="tile-top"><i class="ti ti-books"></i><span>Learn</span></div>
      <div class="tile-stat" id="tileLearnStat">0 in queue</div>
    </a>
    <a class="mod-card mod-mind tile" href="uni.html" id="tileUni">
      <div class="tile-top"><i class="ti ti-school"></i><span>Uni</span></div>
      <div class="tile-stat" id="tileUniStat">0 due</div>
    </a>
    <a class="mod-card mod-mind tile tile-wide" href="games.html" id="tileGames">
      <div class="tile-top"><i class="ti ti-device-gamepad-2"></i><span>Games</span></div>
      <div class="tile-stat" id="tileGamesStat">0 playing</div>
    </a>
  </div>

  <!-- CONSISTENCY -->
  <div class="section-title">Consistency</div>
  <div class="card mod-card mod-mind" id="learnConsCard">
    <div class="cons-overall">
      <div class="cons-overall-num" id="learnConsOverallNum">0%</div>
      <div class="cons-overall-lbl">learn execution — last 30 days</div>
    </div>
    <div class="mod-body">
      <div class="heat-row">
        <div class="heat-label">Learn</div>
        <div class="heat-grid" id="learnHeatGrid"></div>
        <div class="heat-streak" id="learnHeatStreak"></div>
      </div>
    </div>
    <div class="cons-detail" id="learnConsDetail">Tap a day to see the breakdown.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script>
/* ============================================================
   SHARED HELPERS — identical conventions to every other page.
   ============================================================ */
function storeGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function storeSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function pad2(n){ return String(n).padStart(2,'0'); }
function getActiveDateString(){ var d=new Date(); if(d.getHours()<6) d.setDate(d.getDate()-1); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function lastNDates(n){
  var base=new Date(); if(base.getHours()<6) base.setDate(base.getDate()-1);
  var out=[];
  for(var i=n-1;i>=0;i--){ var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-i);
    out.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())); }
  return out;
}
function fmtFull(date){ return new Date(date+'T12:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function loadQueue(){ return storeGet('learn:queue') || []; }
function saveQueue(q){ storeSet('learn:queue', q); }

function learnHitForDate(date){
  var queue = loadQueue();
  return queue.some(function(q){ return !!q.done && q.doneDate === date; });
}

var Mind = {}; /* module registry — each section publishes { refresh: fn } here */

/* ============================================================
   HERO — Learn / Uni / Games chips.
   ============================================================ */
var CHIP_DEFS = [
  { key:'learn', label:'Learn', icon:'ti-books' },
  { key:'uni',   label:'Uni',   icon:'ti-school' },
  { key:'games', label:'Games', icon:'ti-device-gamepad-2' }
];
var chipEls = {};
(function buildHero(){
  var row = document.getElementById('pillarRow');
  CHIP_DEFS.forEach(function(cd){
    var chip = document.createElement('div'); chip.className = 'pillar-chip';
    chip.innerHTML = '<i class="ti '+cd.icon+'"></i><span>'+cd.label+'</span>';
    row.appendChild(chip);
    chipEls[cd.key] = chip;
  });
  document.getElementById('heroDate').textContent = fmtFull(getActiveDateString());
})();
function updateHero(){
  var date = getActiveDateString();
  document.getElementById('heroDate').textContent = fmtFull(date);
  var hits = 0;
  var lHit = learnHitForDate(date); if (lHit) hits++;
  chipEls.learn.classList.toggle('hit', lHit);
  var uniDeadlines = storeGet('uni:deadlines'); if (!Array.isArray(uniDeadlines)) uniDeadlines = [];
  var uHit = !uniDeadlines.some(function(d){ return d.status !== 'done' && d.dueDate <= date; });
  if (uHit) hits++;
  chipEls.uni.classList.toggle('hit', uHit);
  var gamesLog = storeGet('games:log'); if (!Array.isArray(gamesLog)) gamesLog = [];
  var gHit = gamesLog.some(function(g){ return g.status === 'playing'; });
  if (gHit) hits++;
  chipEls.games.classList.toggle('hit', gHit);
  document.getElementById('pillarFill').style.width = (hits/3*100)+'%';
  document.getElementById('pillarSummary').textContent = hits+' / 3 clear';
}

/* ============================================================
   LEARN QUEUE — undone items first, then items completed today;
   items completed on earlier days are history and stay hidden
   here (see learn.html for the full manager). Rows are built
   ONCE; a tap only toggles a class in place (no rebuild), so
   ticking stays instant even with a 30-day heatmap on the page.
   ============================================================ */
(function(){
  var heatDebounce = null;

  function visibleItems(queue, today){
    var undone = queue.filter(function(q){ return !q.done; });
    var doneToday = queue.filter(function(q){ return !!q.done && q.doneDate === today; });
    return undone.concat(doneToday);
  }

  function build(){
    var queue = loadQueue();
    var today = getActiveDateString();
    var visible = visibleItems(queue, today);
    var list = document.getElementById('learnList'); list.innerHTML = '';
    if (!visible.length){
      var e = document.createElement('div'); e.className = 'td-empty'; e.textContent = 'Queue is empty — add something to learn.';
      list.appendChild(e);
    } else {
      visible.forEach(function(item){
        var row = document.createElement('div'); row.className = 'item' + (item.done ? ' done' : '');
        row.innerHTML = '<span class="cb"></span><span class="item-txt">' + item.name + '</span>';
        row.addEventListener('click', function(){ toggleItem(item.id, row); });
        list.appendChild(row);
      });
    }
    updateCount();
  }

  function updateCount(){
    var today = getActiveDateString();
    var doneToday = loadQueue().filter(function(q){ return !!q.done && q.doneDate === today; }).length;
    var cnt = document.getElementById('learnCount');
    cnt.textContent = doneToday + ' done today';
    cnt.classList.toggle('all-done', doneToday > 0);
  }

  function toggleItem(id, row){
    var queue = loadQueue();
    var idx = -1, i;
    for (i=0;i<queue.length;i++){ if (queue[i].id === id){ idx = i; break; } }
    if (idx < 0) return;
    queue[idx].done = !queue[idx].done;
    if (queue[idx].done){ queue[idx].doneDate = getActiveDateString(); }
    else { delete queue[idx].doneDate; }
    saveQueue(queue);
    row.classList.toggle('done', !!queue[idx].done);
    updateCount();
    updateHero();
    if (heatDebounce) clearTimeout(heatDebounce);
    heatDebounce = setTimeout(function(){ if (Mind.consistency) Mind.consistency.refresh(); }, 400);
  }

  document.getElementById('learnBtn').addEventListener('click', function(){
    var input = document.getElementById('learnIn');
    var text = (input.value || '').trim();
    if (!text) return;
    var queue = loadQueue();
    queue.push({ id:uid(), name:text, done:false });
    saveQueue(queue);
    input.value = '';
    build();
    if (Mind.tiles) Mind.tiles.refresh();
  });
  document.getElementById('learnIn').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('learnBtn').click();
  });

  build();
  Mind.learn = { refresh: build };
})();

/* ============================================================
   TILES — nav grid; Learn/Uni/Games stats mirror live data.
   ============================================================ */
function updateTiles(){
  var undoneCount = loadQueue().filter(function(q){ return !q.done; }).length;
  document.getElementById('tileLearnStat').textContent = undoneCount + ' in queue';
  var uniDeadlines = storeGet('uni:deadlines'); if (!Array.isArray(uniDeadlines)) uniDeadlines = [];
  var dueCount = uniDeadlines.filter(function(d){ return d.status !== 'done'; }).length;
  document.getElementById('tileUniStat').textContent = dueCount + ' due';
  var gamesLog = storeGet('games:log'); if (!Array.isArray(gamesLog)) gamesLog = [];
  var playingCount = gamesLog.filter(function(g){ return g.status === 'playing'; }).length;
  document.getElementById('tileGamesStat').textContent = playingCount + ' playing';
}
updateTiles();
Mind.tiles = { refresh: updateTiles };

/* ============================================================
   CONSISTENCY — 30-day heatmap of learn-queue completions.
   KNOWN LIMITATION: history here is derived from doneDate on the
   live queue items (there's no separate log), so deleting a
   completed item also erases that day from the heatmap.
   ============================================================ */
(function(){
  var HEAT_N = 30;
  var cells = [], dates = [];
  var selIdx = -1;

  function countForDate(date){
    return loadQueue().filter(function(q){ return q.doneDate === date; }).length;
  }

  function build(){
    dates = lastNDates(HEAT_N);
    var host = document.getElementById('learnHeatGrid'); host.innerHTML = '';
    cells = [];
    dates.forEach(function(date, idx){
      var cell = document.createElement('div'); cell.className = 'heat-cell';
      cell.setAttribute('data-idx', idx);
      cell.addEventListener('click', function(){
        selIdx = (selIdx === idx) ? -1 : idx;
        updateSelection();
      });
      host.appendChild(cell);
      cells.push(cell);
    });
  }

  function updateSelection(){
    cells.forEach(function(c, idx){ c.classList.toggle('sel', idx === selIdx); });
    var detail = document.getElementById('learnConsDetail');
    if (selIdx < 0){ detail.textContent = 'Tap a day to see the breakdown.'; return; }
    var date = dates[selIdx];
    var n = countForDate(date);
    detail.innerHTML = '<b>' + fmtFull(date) + '</b> · ' + n + ' completed';
  }

  function refresh(){
    dates = lastNDates(HEAT_N);
    var hits = 0, curStreak = 0, bestStreak = 0, run = 0, i;
    for (i=0;i<dates.length;i++){
      var n = countForDate(dates[i]);
      var hit = n >= 1;
      if (hit){ hits++; run++; if (run > bestStreak) bestStreak = run; } else { run = 0; }
      if (n >= 2){ cells[i].style.background = '#f87171'; cells[i].style.boxShadow = '0 0 5px rgba(248,113,113,0.6)'; }
      else if (n >= 1){ cells[i].style.background = 'rgba(248,113,113,0.45)'; cells[i].style.boxShadow = 'none'; }
      else { cells[i].style.background = 'rgba(255,255,255,0.05)'; cells[i].style.boxShadow = 'none'; }
    }
    for (i=dates.length-1;i>=0;i--){ if (countForDate(dates[i]) >= 1) curStreak++; else break; }
    document.getElementById('learnHeatStreak').innerHTML = '<b>' + curStreak + '</b> now<br>' + bestStreak + ' best';
    var overallPct = Math.round(hits / dates.length * 100);
    document.getElementById('learnConsOverallNum').textContent = overallPct + '%';
    updateSelection();
  }

  build();
  refresh();
  Mind.consistency = { refresh: refresh };
})();

/* ============================================================
   BOOT — hero, sync/focus refresh, staggered entry animation.
   ============================================================ */
updateHero();

function refreshAllModules(){
  updateHero();
  if (Mind.learn) Mind.learn.refresh();
  if (Mind.tiles) Mind.tiles.refresh();
  if (Mind.consistency) Mind.consistency.refresh();
}
window.addEventListener('lo-sync-applied', refreshAllModules);
window.addEventListener('focus', refreshAllModules);

(function(){
  var cards = document.querySelectorAll('.mod-card');
  Array.prototype.forEach.call(cards, function(c, idx){ c.style.transitionDelay = (idx*50)+'ms'; });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      Array.prototype.forEach.call(cards, function(c){ c.classList.add('lo-visible'); });
    });
  });
})();
</script>
</body>
</html>
